[project]
name = "compliance-advisor"
version = "0.1.0"
description = "Compliance Advisor backend: regulatory information for financial firms supervised in Germany (not legal advice)"
readme = "README.md"
authors = [
    { name = "r-roemisch", email = "rudolf.roemisch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
compliance-advisor-fetch = "compliance_advisor.fetch:main"
compliance-advisor-ingest = "compliance_advisor.ingest:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
