# Golden Set: test questions for the evaluation (docs/EVALUATION.md).
#
# Not legal advice: the Compliance Advisor gives general regulatory information only.
#
# Status: draft v3 (second-pass review 2026-10-24), built 2026-10-23, to be reviewed by you. For each item, check:
#   - Is the question realistic for a compliance team at a bank, insurer or payment/crypto firm?
#   - Are the `expected` Provisions the right ones? Add other Provisions that would also be a
#     correct answer. Lists are kept short on purpose: a label is included only if a Passage from
#     that Provision alone would be a correct (partial) answer, because a hit on a loosely
#     related Provision would be a false positive under the any-of-six rule.
#   - Then set `status: reviewed`, or `status: rejected` with a reason in `notes`.
#
# How this version was built:
#   1. Every `expected` label and every `answer_key` was checked against the official text of the
#      Source version in the Corpus (EUR-Lex consolidated texts incl. CRR III, CRD VI and the AI Act
#      as amended by Regulation (EU) 2026/1744; gesetze-im-internet; BaFin MaRisk 06/2026, MaGo
#      09/2025, AuA GwG 2025), and every item was re-checked by an independent second pass on
#      2026-10-24 (corrections are marked 'v3' in `notes`). Where a check could not be completed,
#      `notes` says so.
#   2. Questions marked with an `origin` other than "drafted" are real questions with official
#      answers, taken from the EBA Single Rulebook Q&A, EIOPA Q&A on regulation, BaFin FAQs
#      (DORA, ZAG-Merkblatt), the FIU FAQ, the Fachgremium MaRisk minutes, the EU AI Act Service
#      Desk FAQ and the EDPB SME guide. `source_url` points to the original.
#   3. `seed` is true only when every expected Provision belongs to one of the first six Sources
#      (DORA, Delegated Regulation 2024/1772, AMLR, GwG, BaFin AuA GwG, ZAG).
#
# Fields
#   id          short and stable; results refer to it
#   question    as a Compliance Officer would ask it
#   language    de | en
#   regime      dora | aml | payments | insurance | banking | digital
#   expected    Provision labels exactly as in the index ("Art. 17 DORA", "§ 10 GwG", "AT 4.4.2 MaRisk",
#               "7 BaFin AuA GwG", "10.2 MaGo", "Art. 9 Delegated Regulation (EU) 2024/1772").
#               A search counts as a hit when any of them is among the six Passages.
#   seed        true when the question can be answered from the first six Sources, so the naive
#               baseline index (which holds only those) can be compared on it
#   status      draft | reviewed | rejected
#   notes       anything worth knowing (cross-lingual, crowding, what could not be verified)
#   cross_lingual  true when the question language differs from the language of at least one expected
#               Source (German question on an EU act, or English question on a German act); derived,
#               added in v2 for slicing results
#   type        lookup | threshold | definition | applicability | scenario | cross_regime | crowding | temporal
#               (added in v2; used for slicing results)
#   origin      drafted | EBA Q&A <id> | EIOPA Q&A <id> | BaFin FAQ DORA | BaFin ZAG-Merkblatt | FIU FAQ |
#               Fachgremium MaRisk | AI Act Service Desk | EDPB SME guide   (added in v2)
#   source_url  link to the official Q&A the question was taken from (added in v2, optional)
#   answer_key  short reference answer with paragraph references, for reviewing and for a later
#               answer-quality evaluation (added in v2). Not used by the retrieval metric.
#
# The loader (GoldenItem in backend/src/compliance_advisor/evaluation.py) accepts exactly these fields.

items:

  # --- DORA ---
  - id: dora-major-criteria
    question: "When is an ICT-related incident considered a major incident under DORA?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 8 Delegated Regulation (EU) 2024/1772", "Art. 18 DORA", "Art. 3 DORA"]
    seed: true
    status: draft
    type: definition
    origin: drafted
    notes: "v3: 'Art. 3 DORA' added - the Art. 3(10) definition alone is a correct partial answer."
    answer_key: >-
      Major when critical services are affected (Art. 6 RTS 2024/1772: ICT systems supporting critical or
      important functions, authorised/supervised financial services, or a successful malicious unauthorised
      access) and either the malicious-access threshold of Art. 9(5)(b) RTS is met or two or more of the other
      materiality thresholds of Art. 9 RTS are met (Art. 8(1) RTS). Art. 18(1) DORA lists the six classification
      criteria that the RTS specifies. Art. 3(10) DORA defines a major ICT-related incident as an ICT-related
      incident with a high adverse impact on the network and information systems that support critical or
      important functions.
  - id: dora-client-threshold
    question: "Ab wie vielen betroffenen Kunden ist bei einem IKT-Vorfall die Wesentlichkeitsschwelle erreicht?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 9 Delegated Regulation (EU) 2024/1772"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual: German question, English Source."
    answer_key: >-
      Bei mehr als 10 % der Kunden, die den betroffenen Dienst nutzen, oder bei mehr als 100 000 Kunden (Art.
      9(1)(a), (b) RTS 2024/1772); daneben bei mehr als 30 % der Finanzkontrahenten oder mehr als 10 % der
      durchschnittlichen täglichen Anzahl oder des Werts der Transaktionen (Art. 9(1)(c)-(e)) oder wenn als
      relevant eingestufte Kunden oder Finanzkontrahenten nach Art. 1(3) RTS betroffen sind (Art. 9(1)(f)). Es
      gibt keine absolute Euro-Schwelle für Transaktionen; fehlende Zahlen sind anhand von Referenzzeiträumen zu
      schätzen.
  - id: dora-incident-process
    question: "What must a financial entity's ICT-related incident management process include?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 17 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      A process to detect, manage and notify ICT-related incidents, with recording of all incidents and
      significant cyber threats (Art. 17(1)-(2)): early warning indicators; procedures to identify, track, log,
      categorise and classify incidents by priority, severity and criticality of services; roles and
      responsibilities; communication plans for staff, external stakeholders, media and clients; reporting of
      at least major incidents to senior management and the management body; response procedures
      (Art. 17(3)(a)-(f)).
  - id: dora-scope
    question: "Which financial entities fall within the scope of DORA?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 2 DORA"]
    seed: true
    status: draft
    type: applicability
    origin: drafted
    answer_key: >-
      The 20 types listed in Art. 2(1)(a)-(t) (credit institutions, payment and e-money institutions incl.
      exempted ones, account information service providers, investment firms, CASPs and ART issuers, CSDs,
      CCPs, trading venues, trade repositories, AIFMs, UCITS management companies, data reporting providers,
      (re)insurers, insurance intermediaries, IORPs, CRAs, benchmark administrators, crowdfunding providers,
      securitisation repositories) plus ICT third-party service providers (u). Art. 2(3) excludes e.g. small
      AIFMs, insurers below the Solvency II thresholds, IORPs with not more than 15 members, and micro/SME
      insurance intermediaries; Art. 2(4) lets Member States exclude certain CRD-exempt institutions.
  - id: dora-report-deadlines
    question: "What are the time limits for the initial notification of a major ICT-related incident?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 5 Delegated Regulation (EU) 2025/301"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "The reporting standard is not among the first six Sources. v2: 'Art. 19 DORA' removed from expected - Art. 19(4) names the three report types but contains no time limit, so a hit on it would be a false positive."
    answer_key: >-
      Initial notification as early as possible and within 4 hours of classifying the incident as major, but no
      later than 24 hours after becoming aware of it (if classified as major only later, 4 hours from
      classification); intermediate report within 72 hours of the initial notification; final report no later
      than one month after the (latest updated) intermediate report (Art. 5(1)-(2) RTS 2025/301).
  - id: dora-intermediaries-scope
    question: "Gilt DORA auch für Versicherungsvermittler?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 2 DORA"]
    seed: true
    status: draft
    type: applicability
    origin: drafted
    notes: "Cross-lingual. Persona insurer/intermediary."
    answer_key: >-
      Ja: Versicherungsvermittler, Rückversicherungsvermittler und Versicherungsvermittler in Nebentätigkeit
      sind nach Art. 2(1)(o) erfasst; ausgenommen sind nach Art. 2(3)(e) Vermittler, die Kleinstunternehmen
      oder kleine oder mittlere Unternehmen sind (Schwellen in Art. 3(60), (63), (64)).
  - id: dora-management-body
    question: "What are the management body's responsibilities for ICT risk under DORA?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 5 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      The management body defines, approves, oversees and is responsible for the ICT risk management framework
      and bears ultimate responsibility for ICT risk (Art. 5(1)-(2)): data policies, roles, the digital
      operational resilience strategy incl. risk tolerance, business continuity and recovery plans, audit plans,
      the resilience budget, the ICT third-party policy and reporting channels. Members must keep sufficient
      knowledge up to date through regular training (Art. 5(4)); non-micro entities designate a role to monitor
      third-party arrangements (Art. 5(3)).
  - id: dora-framework-review
    question: "Wie oft müssen wir unseren IKT-Risikomanagementrahmen überprüfen?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 6 DORA"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Mindestens einmal jährlich (Kleinstunternehmen: periodisch), außerdem nach schwerwiegenden IKT-Vorfällen,
      auf aufsichtliche Anweisung und nach Erkenntnissen aus Resilienztests oder Prüfungen; ein Bericht über die
      Überprüfung ist der Aufsicht auf Verlangen vorzulegen (Art. 6(5)); zusätzlich regelmäßige interne Prüfung
      nach Prüfungsplan mit Follow-up kritischer Feststellungen (Art. 6(6)-(7)).
  - id: dora-simplified-framework
    question: "Which financial entities may apply the simplified ICT risk management framework?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 16 DORA"]
    seed: true
    status: draft
    type: applicability
    origin: drafted
    answer_key: >-
      Small and non-interconnected investment firms, payment institutions exempted under PSD2, institutions
      exempted under CRD for which the Member State has not used the Art. 2(4) DORA exclusion, e-money
      institutions exempted under EMD2, and small IORPs (Art. 16(1)); Arts. 5-15 do not apply to them, but
      they must still keep a documented framework, monitor systems, handle incidents, map key third-party
      dependencies, maintain and test continuity/backup plans and train staff (Art. 16(1)(a)-(h), 16(2)).
  - id: dora-register
    question: "Was muss das Informationsregister über unsere IKT-Drittdienstleister enthalten?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 28 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "Cross-lingual. The ITS templates (Implementing Regulation 2024/2956) are not in the Corpus."
    answer_key: >-
      Ein Register aller vertraglichen Vereinbarungen über IKT-Dienstleistungen auf Einzel-, teilkonsolidierter
      und konsolidierter Ebene, mit Kennzeichnung der Vereinbarungen für kritische oder wichtige Funktionen;
      mindestens jährlich Meldung an die Aufsicht (Zahl neuer Vereinbarungen, Kategorien der Dienstleister, Art
      der Vereinbarungen und Dienste), Vorlage des vollständigen Registers auf Verlangen und rechtzeitige
      Information über geplante Verträge für kritische oder wichtige Funktionen (Art. 28(3)).
  - id: dora-contract-clauses
    question: "Which contractual provisions must a contract with an ICT third-party provider supporting a critical or important function contain?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 30 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      All contracts: description of functions and services, processing locations, data protection provisions,
      access/recovery/return of data on insolvency or termination, service levels, incident assistance,
      cooperation with authorities, termination rights and notice periods, participation in security awareness
      programmes (Art. 30(2)(a)-(i)). For critical or important functions additionally full SLAs with
      quantitative and qualitative targets, notice and reporting duties, business contingency plans, TLPT
      participation, unrestricted access, inspection and audit rights, and exit strategies with a transition
      period (Art. 30(3)(a)-(f)).
  - id: dora-tlpt-frequency
    question: "How often do we have to perform threat-led penetration testing, and which entities are obliged to?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 26 DORA"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      At least every three years for the financial entities the competent authority identifies under
      Art. 26(8) (impact, systemic character, ICT risk profile); the authority may require a higher or lower
      frequency (Art. 26(1)). Tests cover several or all critical or important functions on live production
      systems (Art. 26(2)), ICT providers in scope must participate while the entity stays responsible
      (Art. 26(3)); microenterprises and Art. 16(1) entities are out of scope; testers per Art. 27.
  - id: dora-testing-yearly
    question: "Müssen wir alle IKT-Systeme jährlich testen?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 24 DORA"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual. Expected answer starts with 'nicht alle'."
    answer_key: >-
      Nicht alle: mindestens jährlich sind angemessene Tests aller IKT-Systeme und -Anwendungen durchzuführen,
      die kritische oder wichtige Funktionen unterstützen (Art. 24(6)); das Testprogramm ist risikobasiert nach
      Kritikalität auszugestalten (Art. 24(3)), Tests sind von unabhängigen internen oder externen Parteien
      durchzuführen (Art. 24(4)) und Schwachstellen priorisiert zu beheben (Art. 24(5)); Kleinstunternehmen
      sind von Art. 24 ausgenommen und testen risikobasiert (Art. 25(3)).
  - id: dora-client-information
    question: "Do we have to inform our clients when a major ICT-related incident occurs?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 19 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Yes, where the major ICT-related incident has an impact on the financial interests of clients, the entity
      must inform them without undue delay as soon as it becomes aware, about the incident and the measures
      taken to mitigate adverse effects; in case of a significant cyber threat, potentially affected clients are
      informed of appropriate protection measures where applicable (Art. 19(3)).
  - id: dora-outsource-reporting
    question: "Dürfen wir die Meldung schwerwiegender IKT-Vorfälle an einen Dienstleister auslagern?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 19 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: BaFin FAQ DORA
    source_url: https://www.bafin.de/DE/unternehmen-maerkte/aufsicht/alle-unternehmen/dora/Meldewesen_IKT_Vorfaelle/FAQ/FAQ_node.html
    notes: "Cross-lingual. BaFin adds procedural conditions (notification form, no double reporting) that are not in the Corpus."
    answer_key: >-
      Ja: Die Meldepflichten nach Art. 19 dürfen im Einklang mit Unions- und nationalem sektoralem Recht an
      einen Drittdienstleister ausgelagert werden; das Finanzunternehmen bleibt für die Erfüllung in vollem
      Umfang verantwortlich (Art. 19(5)). Die RTS 2025/301 sieht dafür nur Datenfelder für die meldende Stelle
      und für aggregierte Meldungen vor (Art. 1(c), (d) RTS 2025/301).
  - id: dora-voluntary-threat
    question: "Must significant cyber threats be reported to the competent authority?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 19 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "v3: 'Art. 10 Delegated Regulation (EU) 2024/1772' removed from expected - it defines when a cyber threat is significant but says nothing about whether notification is mandatory, so a hit on it alone would be a false positive; its content stays in the answer key."
    answer_key: >-
      No. Financial entities may notify significant cyber threats on a voluntary basis where they deem the
      threat relevant to the financial system, service users or clients (Art. 19(2)). A threat is significant
      only if it could affect critical or important functions, has a high probability of materialising and would
      meet the criticality criterion of Art. 6 or the thresholds of Art. 9(1)/(4) of the RTS (Art. 10 RTS
      2024/1772); the content of a voluntary notification is in Art. 6 RTS 2025/301.
  - id: dora-exit-strategy
    question: "Welche Exit-Strategien verlangt DORA für IKT-Dienstleister kritischer oder wichtiger Funktionen?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 28 DORA", "Art. 30 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Für IKT-Dienstleistungen zur Unterstützung kritischer oder wichtiger Funktionen sind Ausstiegsstrategien
      festzulegen, die Ausfall, Qualitätsverschlechterung und Vertragsbeendigung abdecken und einen Ausstieg
      ohne Geschäftsunterbrechung und ohne Compliance-Beeinträchtigung ermöglichen; Ausstiegspläne sind zu
      dokumentieren, ausreichend zu testen und regelmäßig zu überprüfen, Alternativlösungen und Übergangspläne
      festzulegen (Art. 28(8)); vertraglich sind Ausstiegsstrategien mit einer verbindlichen angemessenen
      Übergangsfrist zu vereinbaren (Art. 30(3)(f)).
  - id: dora-concentration-risk
    question: "What do we have to assess regarding ICT concentration risk before signing a contract with an ICT provider?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 29 DORA", "Art. 28 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      As part of the pre-contractual assessment (Art. 28(4)(c)): whether the arrangement would mean contracting a
      provider that is not easily substitutable, or multiple arrangements with the same or closely connected
      providers, weighing benefits and costs of alternatives (Art. 29(1)); where subcontracting is possible, its
      benefits and risks, in particular ICT subcontractors established in a third country; for all arrangements
      supporting critical or important functions the applicable insolvency law and constraints on urgent data
      recovery; for third-country providers additionally compliance with Union data protection rules and effective
      enforcement of the law there; and whether long or complex subcontracting chains impair the entity's
      monitoring and the authority's supervision (Art. 29(2)).
  - id: dora-backup
    question: "What requirements apply to backup policies and restoration under DORA?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 12 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Documented backup policies with scope and minimum frequency based on criticality and confidentiality,
      plus restoration and recovery procedures (Art. 12(1)); backup systems whose activation does not
      jeopardise security, tested periodically (Art. 12(2)); restoration via ICT systems physically and
      logically segregated from the source system (Art. 12(3)); redundant capacities (Art. 12(4)); CSDs keep a
      geographically distant secondary processing site (Art. 12(5)); RTO/RPO per criticality and data
      reconciliation after recovery (Art. 12(6)-(7)).
  - id: dora-training
    question: "Müssen auch Vorstandsmitglieder DORA-Schulungen absolvieren?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 5 DORA", "Art. 13 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Ja: Mitglieder des Leitungsorgans müssen ausreichende Kenntnisse und Fähigkeiten zum Verständnis und zur
      Bewertung von IKT-Risiken aktiv aktuell halten, auch durch regelmäßige spezifische Schulungen
      entsprechend dem gemanagten IKT-Risiko (Art. 5(4)); daneben sind Sensibilisierungsprogramme und
      Schulungen zur digitalen operationalen Resilienz als Pflichtmodule für alle Mitarbeiter und die
      Geschäftsleitung vorzusehen (Art. 13(6)).
  - id: dora-critical-function-def
    question: "What is a 'critical or important function' under DORA?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 3 DORA"]
    seed: true
    status: draft
    type: definition
    origin: drafted
    answer_key: >-
      A function whose disruption would materially impair the financial performance of the entity or the
      soundness or continuity of its services and activities, or whose discontinued, defective or failed
      performance would materially impair continuing compliance with the conditions and obligations of its
      authorisation or other obligations under financial services law (Art. 3(22)).
  - id: dora-intragroup
    question: "Fallen konzerninterne IKT-Dienstleister unter die Drittparteiregeln von DORA?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 3 DORA", "Art. 31 DORA"]
    seed: true
    status: draft
    type: applicability
    origin: drafted
    notes: "Cross-lingual. v2: 'Art. 28 DORA' removed - the article never mentions intra-group providers; the answer rests on the Art. 3(20) definition and the Art. 31(8)(iii) exclusion (v3: the exclusions in Art. 31(8) are numbered (i)-(iv), not (a)-(d))."
    answer_key: >-
      Ja: 'IKT-Drittdienstleister' ist jedes Unternehmen, das IKT-Dienstleistungen bereitstellt (Art. 3(19)), und
      DORA definiert den 'IKT-konzerninternen Dienstleister' eigens als gruppenzugehöriges Unternehmen, das
      überwiegend IKT-Dienstleistungen an Finanzunternehmen derselben Gruppe erbringt (Art. 3(20)); die
      Drittparteiregeln (Art. 28-30) gelten daher auch gruppenintern. Vom Benennungsverfahren für kritische
      IKT-Drittdienstleister sind konzerninterne Dienstleister ausgenommen (Art. 31(8)(iii)).
  - id: dora-payment-incidents-which-law
    question: "Als Zahlungsinstitut - melden wir schwerwiegende Zahlungsvorfälle nach dem ZAG oder nach DORA?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 23 DORA", "§ 54 ZAG"]
    seed: true
    status: draft
    type: cross_regime
    origin: drafted
    notes: "Cross-regime DORA/ZAG; persona payment institution."
    answer_key: >-
      Nach DORA: Art. 23 DORA erstreckt die Anforderungen des Kapitels III (Art. 17-22) auf Betriebs- oder
      Sicherheitsvorfälle im Zahlungsverkehr bei Kreditinstituten, Zahlungsinstituten,
      Kontoinformationsdienstleistern und E-Geld-Instituten. § 54 Abs. 7 ZAG (eingefügt durch das FinmadiG)
      bestimmt, dass die ZAG-Meldung nach § 54 Abs. 1-4 für Zahlungsdienstleister nach § 1 Abs. 1 S. 1 Nr. 1-3
      ZAG nicht mehr gilt; die jährliche Betrugsstatistik nach § 54 Abs. 5 ZAG bleibt.
  - id: dora-recurring-incidents
    question: "Can several minor ICT incidents together count as one major incident?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 8 Delegated Regulation (EU) 2024/1772"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      Yes: incidents that individually are not major are considered one major incident where they have occurred at
      least twice within six months, have the same apparent root cause and collectively fulfil the major-incident
      criteria (Art. 8(2) RTS 2024/1772); entities assess the existence of recurring incidents monthly, and the
      rule does not apply to microenterprises or Art. 16(1) DORA entities (Art. 8(2), second and third
      subparagraphs - the article has only two numbered paragraphs).
  - id: dora-downtime-threshold
    question: "Ab welcher Dauer oder Ausfallzeit gilt ein IKT-Vorfall als wesentlich?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 9 Delegated Regulation (EU) 2024/1772"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual. Art. 3 RTS 2024/1772 (how duration and downtime are measured) is a possible second label if all-of semantics are used."
    answer_key: >-
      Wenn der Vorfall länger als 24 Stunden dauert oder die Ausfallzeit eines IKT-Dienstes, der kritische oder
      wichtige Funktionen unterstützt, mehr als 2 Stunden beträgt (Art. 9(3) RTS 2024/1772); die Dauer wird vom
      Eintritt (hilfsweise ab Entdeckung) bis zur Behebung gemessen, die Ausfallzeit ab Nichtverfügbarkeit bis
      zur Wiederherstellung des Serviceniveaus (Art. 3 RTS).
  - id: dora-economic-impact
    question: "Which economic impact threshold makes an ICT incident major?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 9 Delegated Regulation (EU) 2024/1772"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "v2: labels corrected - the RTS has 13 articles; all thresholds sit in Art. 9. Art. 7 (what to count) is optional."
    answer_key: >-
      Where direct and indirect costs and losses from the incident have exceeded, or are likely to exceed, EUR 100
      000 (Art. 9(6) RTS 2024/1772). Art. 7 RTS lists what to count without netting recoveries (expropriated
      funds, replacement of software/hardware, staff costs, fees due to non-compliance with contractual
      obligations, customer redress, forgone revenues, communication and advisory costs) and what to exclude
      (maintenance, upgrades, insurance premiums).
  - id: dora-initial-notification-content
    question: "What information must the initial notification of a major ICT-related incident contain?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 2 Delegated Regulation (EU) 2025/301", "Art. 1 Delegated Regulation (EU) 2025/301"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "The reporting standard is not among the first six Sources."
    answer_key: >-
      Incident reference code; date and time of detection and of classification as major; description;
      classification criteria met; Member States impacted; how the incident was discovered; origin where
      available; whether a business continuity plan was activated; reclassification information where
      applicable (Art. 2(a)-(j) RTS 2025/301); plus the general information of Art. 1 (type of submission,
      name, LEI and type of the entity, submitting entity, entities covered by an aggregated report, contacts,
      parent undertaking, currency).
  - id: dora-final-report-deadline
    question: "Wann ist der Abschlussbericht zu einem schwerwiegenden IKT-Vorfall fällig?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 5 Delegated Regulation (EU) 2025/301"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual; not among the first six Sources."
    answer_key: >-
      Spätestens einen Monat nach Übermittlung des Zwischenberichts bzw. des letzten aktualisierten
      Zwischenberichts (Art. 5(1)(c) RTS 2025/301). Fällt die Frist auf ein Wochenende oder einen Feiertag,
      genügt die Einreichung bis 12 Uhr mittags des nächsten Arbeitstags (Art. 5(4)); kann die Frist nicht
      eingehalten werden, ist die Behörde vorab mit Gründen zu informieren (Art. 5(3)).
  - id: dora-termination-rights
    question: "In welchen Fällen müssen unsere Verträge mit IKT-Drittdienstleistern kündbar sein?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 28 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Bei erheblichen Verstößen des Dienstleisters gegen Gesetze, Vorschriften oder Vertragsbedingungen; bei im
      Monitoring festgestellten Umständen, die die Leistungserbringung verändern können; bei nachgewiesenen
      Schwächen im IKT-Risikomanagement des Dienstleisters, insbesondere bei Verfügbarkeit, Authentizität,
      Integrität und Vertraulichkeit von Daten; und wenn die Aufsicht das Finanzunternehmen infolge der
      Vereinbarung nicht mehr wirksam beaufsichtigen kann (Art. 28(7)(a)-(d)); Kündigungsrechte und
      Mindestkündigungsfristen sind Pflichtinhalt des Vertrags (Art. 30(2)(h)).
  - id: dora-final-report-content
    question: "What must the final report on a major ICT-related incident contain?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 4 Delegated Regulation (EU) 2025/301", "Art. 1 Delegated Regulation (EU) 2025/301"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "Not among the first six Sources."
    answer_key: >-
      The root causes; dates and times when the incident was resolved and the root cause remediated; how it
      was resolved; information relevant for resolution authorities where applicable; direct and indirect
      costs and losses and financial recoveries; recurring-incident information where applicable (Art. 4 RTS
      2025/301), plus the general information of Art. 1; due no later than one month after the (latest
      updated) intermediate report (Art. 5(1)(c)).
  - id: dora-critical-tpp-criteria
    question: "Which criteria make an ICT third-party provider 'critical' under DORA, and which providers cannot be designated?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 31 DORA"]
    seed: true
    status: draft
    type: definition
    origin: drafted
    answer_key: >-
      The ESAs designate critical providers based on the systemic impact of a large-scale failure (number of
      entities served, value of their assets), the systemic character of the relying entities (G-SIIs/O-SIIs),
      the degree of reliance for critical or important functions incl. via subcontracting, and substitutability
      (Art. 31(2)). Designation does not apply to financial entities providing ICT services to other financial
      entities, Eurosystem-oversight providers, ICT intra-group service providers and providers serving solely
      one Member State (Art. 31(8)).
  - id: dora-weekend-deadline
    question: "Gibt es Erleichterungen für die Meldung eines schwerwiegenden IKT-Vorfalls außerhalb der Geschäftszeiten oder an Wochenenden und Feiertagen?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 5 Delegated Regulation (EU) 2025/301"]
    seed: false
    status: draft
    type: threshold
    origin: BaFin FAQ DORA
    source_url: https://www.bafin.de/DE/unternehmen-maerkte/aufsicht/alle-unternehmen/dora/Meldewesen_IKT_Vorfaelle/FAQ/FAQ_node.html
    notes: "Cross-lingual; not among the first six Sources. Hard negative for the GDPR 72-hour rule."
    answer_key: >-
      Nur eingeschränkt: Grundsätzlich gilt die Erstmeldung binnen 4 Stunden nach Einstufung, spätestens 24
      Stunden nach Kenntnis (Art. 5(1) RTS 2025/301). Fällt eine Frist auf ein Wochenende oder einen Feiertag im
      Mitgliedstaat des Unternehmens, genügt die Einreichung bis 12 Uhr des nächsten Arbeitstags (Art. 5(4)) -
      nicht jedoch für Erstmeldung und Zwischenbericht von Kreditinstituten, CCPs, Handelsplatzbetreibern und
      NIS2-wesentlichen/wichtigen Einrichtungen (Art. 5(5)); die Aufsicht kann die Erleichterung weiteren
      Instituten entziehen (Art. 5(6)).
  - id: dora-tpp-not-reporting
    question: "Sind auch IKT-Drittdienstleister verpflichtet, schwerwiegende IKT-bezogene Vorfälle nach DORA zu melden?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 2 DORA", "Art. 19 DORA"]
    seed: true
    status: draft
    type: applicability
    origin: BaFin FAQ DORA
    source_url: https://www.bafin.de/SharedDocs/FAQs/DE/DORA/Meldewesen_IKT_Vorfaelle/Fragen_zum_ausgelagerten_und_aggregierten_Melden/03.html
    notes: "Cross-lingual."
    answer_key: >-
      Nein. IKT-Drittdienstleister (Art. 2(1)(u)) sind keine Finanzunternehmen (Art. 2(2)), so dass die
      Meldepflicht nach Art. 19(1) sie nicht trifft. Das Finanzunternehmen muss melden, wenn ein Vorfall beim
      Dienstleister bei ihm selbst zu einem schwerwiegenden IKT-bezogenen Vorfall führt.
  - id: dora-cif-availability-only
    question: "Bezieht sich der Begriff 'kritische oder wichtige Funktion' nach DORA nur auf das Schutzziel Verfügbarkeit?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 3 DORA"]
    seed: true
    status: draft
    type: definition
    origin: BaFin FAQ DORA
    source_url: https://www.bafin.de/DE/unternehmen-maerkte/aufsicht/alle-unternehmen/dora/Management_IKT_Drittparteienrisikos/FAQ/FAQ_node.html
    notes: "Cross-lingual. v3: source_url corrected - the question sits in the FAQ on ICT third-party risk, not in the Meldewesen FAQ."
    answer_key: >-
      Nein. Maßgeblich ist, welche Auswirkung eine Störung oder ein Ausfall der Funktion auf die finanzielle
      Leistungsfähigkeit, die Solidität oder Kontinuität der Dienste oder die Einhaltung der
      Zulassungsbedingungen hätte (Art. 3(22)); das ähnelt der Verfügbarkeit, ist aber nicht darauf beschränkt -
      auch eine Verletzung der Vertraulichkeit der verarbeiteten Daten kann eine Funktion kritisch oder wichtig
      machen.
  - id: dora-criticality-components
    question: "Must all three components of the 'critical services affected' criterion be met before an incident can be major?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 6 Delegated Regulation (EU) 2024/1772"]
    seed: true
    status: draft
    type: definition
    origin: EBA Q&A 2024_7047
    source_url: https://www.eba.europa.eu/single-rule-book-qa/qna/view/publicId/2024_7047
    notes: "Joint ESAs Q&A, Final 11/12/2024; the same answer is in the BaFin DORA FAQ."
    answer_key: >-
      No, any one suffices: the criterion is met if ICT services or network and information systems supporting
      critical or important functions are affected, if financial services requiring authorisation, registration
      or supervision are affected, or if a successful, malicious and unauthorised access to the entity's network
      and information systems occurred (Art. 6 RTS 2024/1772). The incident is then major if the further
      conditions of Art. 8 RTS are met.
  - id: dora-customer-phishing
    question: "Kunden unserer Bank erhalten Phishing-Mails mit gefälschten Login-Seiten - ist das ein IKT-bezogener Vorfall, den wir klassifizieren und melden müssen?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 3 DORA"]
    seed: true
    status: draft
    type: scenario
    origin: EBA Q&A 2025_7613
    source_url: https://www.eba.europa.eu/single-rule-book-qa/qna/view/publicId/2025_7613
    notes: "Cross-lingual. Question submitted by BaFin; Joint ESAs Final 06/02/2026. v3: 'Art. 6 Delegated Regulation (EU) 2024/1772' removed - the official answer rests on the Art. 3(8) definition alone; Art. 6 RTS cannot tell whether customer-side phishing is an ICT-related incident."
    answer_key: >-
      Nicht, solange das Phishing nur die Privatsphäre der Kunden betrifft und die Netzwerk- und
      Informationssysteme oder Dienste des Instituts nicht beeinträchtigt sind: dann liegt kein IKT-bezogener
      Vorfall im Sinne von Art. 3(8) DORA vor und weder Schwellen noch Meldepflicht greifen. Wird das Institut
      selbst kompromittiert (z. B. Mitarbeiter-Phishing) oder beeinträchtigt eine breite Kampagne seine
      Dienste, ist es ein IKT-bezogener Vorfall, der nach Art. 6 und 8 RTS 2024/1772 zu klassifizieren ist.
  - id: dora-simplified-register
    question: "We are exempt from Articles 5-15 DORA under the simplified framework - are we also exempt from the register of information?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 16 DORA", "Art. 28 DORA"]
    seed: true
    status: draft
    type: applicability
    origin: EBA Q&A 2025_7388
    source_url: https://www.eba.europa.eu/single-rule-book-qa/qna/view/publicId/2025_7388
    notes: "Joint ESAs Final 08/08/2025."
    answer_key: >-
      No. The Art. 16 exemption covers only Articles 5-15; Art. 28(3) requires every financial entity to
      maintain and update a register of information on all contractual arrangements on ICT services, without
      exception. Proportionality applies to the third-party risk measures (fewer services, no dedicated
      monitoring role), not to the existence of the register.
  - id: dora-register-subcontractors-nonict
    question: "Must our register of information also capture the ICT subcontractors of our non-ICT service providers, e.g. the cloud provider used by a law firm we engage?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 28 DORA", "Art. 3 DORA"]
    seed: true
    status: draft
    type: scenario
    origin: EBA Q&A 2024_7089
    source_url: https://www.eba.europa.eu/single-rule-book-qa/qna/view/publicId/2024_7089
    notes: "Joint ESAs Final 08/08/2025. Art. 3(21) defines ICT services."
    answer_key: >-
      No. Where the direct provider does not supply an ICT service within the meaning of Art. 3(21), the
      arrangement is outside the register under Art. 28(3), and so are that provider's own ICT subcontractors.
      If a risk assessment shows that a subcontractor's ICT service effectively supports a critical or
      important function as if provided directly, Chapter V (Arts. 28-30) applies to it.
  - id: dora-staff-costs
    question: "Do staff costs count towards the costs and losses of a major ICT-related incident, e.g. overtime compensated by time off or staff already earmarked for incident handling?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 7 Delegated Regulation (EU) 2024/1772"]
    seed: true
    status: draft
    type: threshold
    origin: EBA Q&A 2025_7439
    source_url: https://www.eba.europa.eu/single-rule-book-qa/qna/view/publicId/2025_7439
    notes: "Joint ESAs Final 14/11/2025; submitted by a competent authority."
    answer_key: >-
      Yes, where clearly attributable to the incident: working time allocated to incident handling, including
      overtime compensated by time off and pre-planned resources, counts as staff costs under Art. 7(1)(c) RTS
      2024/1772; routine training is excluded as day-to-day cost (Art. 7(2)), retraining needed because of the
      incident is included; costs are estimated from the data available at reporting time, without netting
      recoveries, and feed the EUR 100 000 threshold of Art. 9(6) and the final report (Art. 4 RTS 2025/301).
  - id: dora-intragroup-non-eu
    question: "Our group's ICT intra-group service provider is established outside the EU - would it have to set up an EU subsidiary under Art. 31(12) DORA?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 31 DORA"]
    seed: true
    status: draft
    type: scenario
    origin: EBA Q&A 2024_7096
    source_url: https://www.eba.europa.eu/single-rule-book-qa/qna/view/publicId/2024_7096
    notes: "Joint ESAs Final 11/12/2024."
    answer_key: >-
      No. ICT intra-group service providers (Art. 3(20)) are excluded from designation as critical ICT third-party
      providers by Art. 31(8)(iii), without distinction between EU and third-country establishment; the
      EU-subsidiary requirement of Art. 31(12) applies only to providers designated as critical, so it cannot
      apply to them.
  - id: dora-eu-seat-providers
    question: "Dürfen wir nur IKT-Drittdienstleister nutzen, die einen Sitz in der EU haben?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 31 DORA"]
    seed: true
    status: draft
    type: applicability
    origin: BaFin FAQ DORA
    source_url: https://www.bafin.de/DE/unternehmen-maerkte/aufsicht/alle-unternehmen/dora/Ueberwachungsrahmen_IKT_Drittdienstleister/FAQ/FAQ_node.html
    notes: "Cross-lingual. v3: source_url corrected (FAQ on the oversight framework for critical ICT third-party providers)."
    answer_key: >-
      Nein. DORA verlangt keinen EU-Sitz für IKT-Drittdienstleister; nur ein als kritisch benannter
      IKT-Drittdienstleister mit Sitz in einem Drittland muss binnen zwölf Monaten nach Benennung ein
      Tochterunternehmen in der Union gründen (Art. 31(12)). Für alle anderen Dienstleister gelten die allgemeinen
      Pflichten des Finanzunternehmens, insbesondere Konzentrations- und Drittlandrisiken zu bewerten (Art. 29)
      und die Vertragsinhalte nach Art. 30 zu sichern. Gründet der kritische Dienstleister in dieser Frist kein
      Tochterunternehmen, sind nach Auffassung der BaFin die vor der Einstufung geschlossenen Verträge zu
      kündigen.
  - id: dora-provider-training
    question: "Müssen wir unsere IKT-Drittdienstleister in unsere IKT-Sicherheitsschulungen einbeziehen?"
    language: de
    regime: dora
    cross_lingual: true
    expected: ["Art. 30 DORA", "Art. 13 DORA"]
    seed: true
    status: draft
    type: lookup
    origin: BaFin FAQ DORA
    source_url: https://www.bafin.de/DE/unternehmen-maerkte/aufsicht/alle-unternehmen/dora/Management_IKT_Drittparteienrisikos/FAQ/FAQ_node.html
    notes: "Cross-lingual. v3: source_url corrected (FAQ on ICT third-party risk)."
    answer_key: >-
      Ja, soweit angemessen: Die Schulungen und Sensibilisierungsprogramme sind für alle Mitarbeiter und die
      Geschäftsleitung Pflicht und sollen gegebenenfalls auch IKT-Drittdienstleister einbeziehen (Art. 13(6));
      jeder Vertrag über IKT-Dienstleistungen muss die Bedingungen für die Teilnahme des Dienstleisters an den
      Sensibilisierungs- und Schulungsprogrammen des Finanzunternehmens enthalten (Art. 30(2)(i)).
  - id: dora-nis2-provider
    question: "Our managed-security provider argues that its status as an essential entity under NIS2 limits what we can require under Arts. 28-30 DORA - is that right?"
    language: en
    regime: dora
    cross_lingual: false
    expected: ["Art. 28 DORA", "Art. 30 DORA"]
    seed: true
    status: draft
    type: scenario
    origin: EIOPA Q&A 3501
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/3501-dora-286_en
    notes: "Final 2026 (DORA 286)."
    answer_key: >-
      No. A provider's NIS2 status is irrelevant for Arts. 28-30: the financial entity remains fully
      responsible for complying with all DORA obligations (Art. 28(1)(a)), and for critical or important
      functions the contract must grant unrestricted rights of access, inspection and audit which may not be
      impeded or limited by other contractual arrangements or implementation policies (Art. 30(3)(e)).

  # --- Anti-money laundering ---
  - id: gwg-general-cdd
    question: "Welche allgemeinen Sorgfaltspflichten muss ein Verpflichteter nach dem GwG erfüllen?"
    language: de
    regime: aml
    cross_lingual: false
    expected: ["§ 10 GwG", "5 BaFin AuA GwG"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "v2: AuA chapter 5 (Kundenbezogene Sorgfaltspflichten) added; keep only if the index holds the chapter intro as its own Passage, otherwise the sub-sections 5.1-5.5 each cover one duty."
    answer_key: >-
      Identifizierung des Vertragspartners und der für ihn auftretenden Person, Abklärung und Identifizierung des
      wirtschaftlich Berechtigten einschließlich Eigentums- und Kontrollstruktur, Einholung und Bewertung von
      Informationen über Zweck und angestrebte Art der Geschäftsbeziehung, risikobasierte Feststellung des
      PEP-Status und kontinuierliche Überwachung mit risikoangemessener Aktualisierung (§ 10 Abs. 1 Nr. 1-5);
      Umfang risikoangemessen (§ 10 Abs. 2); Auslöser in § 10 Abs. 3; die AuA behandeln die fünf Pflichten in
      Kapitel 5 (5.1 bis 5.5).
  - id: gwg-cdd-credit-institution
    question: "Welche allgemeinen Sorgfaltspflichten muss ein Kreditinstitut nach dem GwG erfüllen?"
    language: de
    regime: aml
    cross_lingual: false
    expected: ["§ 10 GwG"]
    seed: true
    status: draft
    type: crowding
    origin: drafted
    notes: "Crowding case: 'Kreditinstitut' pulls in KWG paragraphs; the per-Source cap was added for this. § 25j KWG (timing of identity verification at account opening) is a legitimate add-on but does not answer the question alone."
    answer_key: >-
      Dieselben fünf Pflichten wie für alle Verpflichteten (§ 10 Abs. 1 Nr. 1-5 GwG); für Kreditinstitute gilt
      ergänzend § 25j KWG: Die Identitätsüberprüfung darf bei Konto- oder Depoteröffnung unverzüglich nach der
      Eröffnung abgeschlossen werden, solange bis dahin keine Verfügungen möglich sind.
  - id: gwg-cdd-triggers
    question: "Wann müssen wir die allgemeinen Sorgfaltspflichten überhaupt erfüllen - welche Auslöser gibt es?"
    language: de
    regime: aml
    cross_lingual: false
    expected: ["§ 10 GwG", "4 BaFin AuA GwG"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Bei Begründung einer Geschäftsbeziehung (§ 10 Abs. 3 Nr. 1); bei Transaktionen außerhalb einer
      Geschäftsbeziehung ab 1 000 Euro bei Geldtransfers, ab 15 000 Euro bei sonstigen Transaktionen und ab
      1 000 Euro Gegenwert bei Kryptowertetransfers (Nr. 2 a-c); unabhängig von Schwellen bei Anhaltspunkten
      für Geldwäsche oder Terrorismusfinanzierung (Nr. 3) und bei Zweifeln an den Identitätsangaben (Nr. 4);
      AuA Kapitel 4 erläutert die Auslöser.
  - id: gwg-enhanced-cdd
    question: "Wann sind nach dem Geldwäschegesetz verstärkte Sorgfaltspflichten anzuwenden?"
    language: de
    regime: aml
    cross_lingual: false
    expected: ["§ 15 GwG", "7 BaFin AuA GwG"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "§ 15 GwG verified on gesetze-im-internet.de in the Stand 29.6.2026 (second-pass review); Absatz structure unchanged (Abs. 1-10; § 15a separate)."
    answer_key: >-
      Zusätzlich zu den allgemeinen Pflichten bei höherem Risiko nach Risikoanalyse oder Einzelfall (§ 15 Abs.
      1-2) und stets bei PEP, Familienmitgliedern und nahestehenden Personen (Abs. 3 Nr. 1), bei Beteiligung eines
      von der EU-Kommission ermittelten Drittstaats mit hohem Risiko (Nr. 2), bei ungewöhnlich komplexen oder
      großen Transaktionen ohne offensichtlichen Zweck (Nr. 3) und bei grenzüberschreitenden
      Korrespondenzbeziehungen (Nr. 4); Maßnahmen in Abs. 4-7, bei Kryptowertetransfers mit selbst gehosteten
      Adressen § 15a; die AuA erläutern die Fallgruppen in Kapitel 7.
  - id: gwg-mlro
    question: "Welche Aufgaben hat der Geldwäschebeauftragte, und wer muss einen bestellen?"
    language: de
    regime: aml
    cross_lingual: false
    expected: ["§ 7 GwG", "3.2 BaFin AuA GwG", "3.2.5 BaFin AuA GwG"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Verpflichtete nach § 2 Abs. 1 Nr. 1-3, 6, 7, 9 und 15 müssen einen Geldwäschebeauftragten auf
      Führungsebene und einen Stellvertreter bestellen (§ 7 Abs. 1); er ist Ansprechpartner für
      Strafverfolgungsbehörden, FIU und Aufsicht, erhält ausreichende Befugnisse, Mittel und ungehinderten
      Zugang zu Informationen, berichtet unmittelbar der Geschäftsleitung und ist bei Verdachtsmeldungen nicht
      weisungsgebunden (Abs. 5); Benachteiligungsverbot und Kündigungsschutz (Abs. 7); Bestellung und
      Entpflichtung sind vorab anzuzeigen (Abs. 4); Aufgaben im Einzelnen in AuA 3.2.5.
  - id: gwg-beneficial-owner
    question: "Was versteht das GwG unter einem wirtschaftlich Berechtigten?"
    language: de
    regime: aml
    cross_lingual: false
    expected: ["§ 3 GwG", "5.2.1 BaFin AuA GwG", "5.2.2 BaFin AuA GwG"]
    seed: true
    status: draft
    type: definition
    origin: drafted
    answer_key: >-
      Die natürliche Person, in deren Eigentum oder unter deren Kontrolle der Vertragspartner letztlich steht oder
      auf deren Veranlassung eine Transaktion durchgeführt wird (§ 3 Abs. 1); bei juristischen Personen, wer
      unmittelbar oder mittelbar mehr als 25 Prozent der Kapitalanteile hält, mehr als 25 Prozent der Stimmrechte
      kontrolliert oder auf vergleichbare Weise Kontrolle ausübt (§ 3 Abs. 2 Nr. 1-3); kann nach umfassender
      Prüfung niemand ermittelt werden, gilt der gesetzliche Vertreter oder geschäftsführende Gesellschafter als
      fiktiver wirtschaftlich Berechtigter (§ 3 Abs. 2 Satz 5). Die AuA erläutern die Definition in 5.2.1 und die
      gesetzlichen Konkretisierungsbeispiele (ein- und mehrstufige Beteiligungsstrukturen, fiktiver wirtschaftlich
      Berechtigter) in 5.2.2.
  - id: amlr-application
    question: "From when does the EU Anti-Money Laundering Regulation apply?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 90 AMLR"]
    seed: true
    status: draft
    type: temporal
    origin: drafted
    answer_key: >-
      From 10 July 2027; for football agents and professional football clubs from 10 July 2029 (Art. 90). The
      Regulation entered into force on the twentieth day after publication in the OJ of 19 June 2024.
  - id: amlr-cdd-measures
    question: "Which customer due diligence measures does the AMLR require?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 20 AMLR"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Identify and verify the customer; identify the beneficial owners and verify them so that the ownership and
      control structure is understood; assess and obtain information on the purpose and intended nature of the
      relationship; verify whether customer or beneficial owners are subject to targeted financial sanctions;
      assess the nature of the customer's business; conduct ongoing monitoring incl. source of funds where needed;
      determine PEP status; identify and verify natural persons on whose behalf or for whose benefit a transaction
      is carried out; identify persons acting on behalf of the customer and verify their authorisation (Art.
      20(1)(a)-(i)); extent of the measures is risk-based (Art. 20(2)).
  - id: amlr-obliged-entities-casp
    question: "Are crypto-asset service providers obliged entities under the AMLR?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 3 AMLR", "Art. 2 AMLR"]
    seed: true
    status: draft
    type: applicability
    origin: drafted
    notes: "Crypto partial-answer case: the Corpus has no MiCAR, KMAG or Travel Rule; a good answer says so. CASPs are not named in Art. 3 - they enter through the Art. 2 definition of 'financial institution'."
    answer_key: >-
      Yes. Art. 3 lists financial institutions as obliged entities (Art. 3 point (2)), and 'financial
      institution' is defined in Art. 2(1) point (6) to include crypto-asset service providers, i.e. providers
      under MiCAR performing crypto-asset services other than advice. Authorisation under MiCAR/KMAG and the
      Travel Rule (Regulation (EU) 2023/1113) are outside the Corpus.
  - id: amlr-compliance-officer
    question: "Who has to be appointed as compliance manager and as compliance officer under the AMLR?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 11 AMLR"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      One member of the management body in its management function as compliance manager, responsible for
      implementing the AML policies and for at least annual reporting to the management body (Art. 11(1)); a
      compliance officer with sufficiently high hierarchical standing, appointed by the management body, who runs
      day-to-day AML/CFT policies, procedures and controls incl. sanctions, is the contact point for authorities
      and transmits suspicious transaction reports to the FIU (Art. 11(2), Art. 69(6)); removal only after prior
      notification to the management body, and the supervisor must be notified of the removal, stating whether it
      relates to the AML tasks; both roles may be combined where justified by size and risk.
  - id: amlr-bo-threshold
    question: "What is the ownership threshold for beneficial ownership under the AMLR?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 52 AMLR", "Art. 51 AMLR"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "v3: direction of the Art. 52(2) threshold corrected ('at most 15 %', not 'at least')."
    answer_key: >-
      Direct or indirect ownership of 25 % or more of the shares, voting rights or other ownership interest, with
      indirect holdings calculated by multiplying the stakes along each chain and adding up the results of all
      chains (Art. 52(1)); beneficial owners are identified via ownership interest and, in parallel, via control
      through other means (Art. 51, Art. 53). For higher-risk categories of corporate entities the Commission may
      set a lower threshold by delegated act after assessing Member State notifications by 10 July 2029: at most
      15 %, or a higher threshold if more proportionate but in any case below 25 % (Art. 52(2)).
  - id: amlr-cash-limit
    question: "Gibt es nach der AMLR eine EU-weite Bargeldobergrenze?"
    language: de
    regime: aml
    cross_lingual: true
    expected: ["Art. 80 AMLR"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Ja: Wer mit Gütern handelt oder Dienstleistungen erbringt, darf Barzahlungen nur bis 10 000 EUR annehmen
      oder leisten, auch bei mehreren offenbar zusammenhängenden Vorgängen (Art. 80(1)); Mitgliedstaaten können
      niedrigere Grenzen festlegen oder beibehalten (Art. 80(2)-(3)); ausgenommen sind Zahlungen zwischen
      Privatpersonen außerhalb einer beruflichen Tätigkeit sowie Zahlungen und Einzahlungen bei
      Kreditinstituten, E-Geld-Emittenten und Zahlungsdienstleistern, die Bareinzahlungen über der Grenze der
      FIU melden müssen (Art. 80(4)).
  - id: amlr-pep-measures
    question: "Which enhanced measures does the AMLR require for politically exposed persons?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 42 AMLR", "Art. 45 AMLR"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Senior management approval before an occasional transaction or a business relationship with a PEP,
      adequate measures to establish the source of wealth and source of funds, and enhanced ongoing monitoring
      (Art. 42(1)); after the person ceases to hold the function, risk-based measures from Art. 34(4) for at
      least 12 months and until the risk no longer exists (Art. 45); the same measures apply to family members
      and known close associates (Art. 46).
  - id: amlr-high-risk-third-countries
    question: "What measures apply to business relationships with customers from high-risk third countries under the AMLR?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 29 AMLR", "Art. 34 AMLR"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      For third countries with significant strategic deficiencies identified by the Commission by delegated act
      (Art. 29(1)-(2)), obliged entities must apply the enhanced due diligence measures of Art. 34(4): additional
      information on customer, beneficial owners, intended nature of the relationship, source of funds and wealth
      and reasons for transactions, senior management approval, enhanced monitoring, and/or first payment through
      an account at a credit institution with equivalent standards (Art. 29(4)); the delegated act also identifies
      the specific countermeasures from Art. 35 that apply (Art. 29(5)); separate regimes for countries with
      compliance weaknesses (Art. 30) and specific threats (Art. 31).
  - id: amlr-outsourcing
    question: "May an obliged entity outsource customer due diligence tasks to a service provider under the AMLR?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 18 AMLR"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    notes: "v2: label corrected from Art. 50 (that article is 'Guidelines on reliance on other obliged entities') to Art. 18 'Outsourcing'."
    answer_key: >-
      Yes, to service providers, with notification to the supervisor before the provider starts and full liability
      remaining with the obliged entity (Art. 18(1)-(2)); the provider must be qualified, apply the entity's
      policies under a written agreement and be controlled regularly (Art. 18(4)). Never outsourceable: proposal
      and approval of the business-wide risk assessment, approval of internal policies, the decision on the
      customer's risk profile and on entering a relationship, suspicious transaction reporting (except to a group
      entity in the same Member State) and approval of the detection criteria (Art. 18(3)); no outsourcing to
      providers in Art. 29-31 countries outside group arrangements.
  - id: amlr-record-retention
    question: "How long must records of customer due diligence be kept under the AMLR, and under the GwG?"
    language: en
    regime: aml
    cross_lingual: true
    expected: ["Art. 77 AMLR", "§ 8 GwG"]
    seed: true
    status: draft
    type: cross_regime
    origin: drafted
    notes: "Same topic, different start of the period: AMLR counts from termination, GwG from the end of the calendar year."
    answer_key: >-
      AMLR: CDD documents, records of suspicion assessments and transaction records for 5 years from the
      termination of the business relationship or the occasional transaction, after which personal data are
      deleted; authorities may require up to 5 further years case by case (Art. 77(1), (3)). GwG: fünf Jahre ab
      dem Schluss des Kalenderjahres, in dem die Geschäftsbeziehung endet, soweit keine andere gesetzliche
      Bestimmung eine längere Frist vorsieht; in jedem Fall sind die Unterlagen spätestens nach Ablauf von zehn
      Jahren zu vernichten (§ 8 Abs. 4).
  - id: amlr-suspicious-reporting
    question: "How quickly must suspicious transactions be reported to the FIU under the AMLR?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 69 AMLR"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      Promptly, on the entity's own initiative and regardless of the amount, where it knows, suspects or has
      reasonable grounds to suspect that funds are proceeds of criminal activity or related to terrorist
      financing, including attempted transactions and suspicions arising from inability to complete CDD; the
      Regulation sets no fixed day limit for the report itself (Art. 69(1)(a)); FIU requests must be answered
      within 5 working days, shorter in urgent cases (Art. 69(1)(b)); reports go through the compliance
      officer (Art. 69(6)).
  - id: amlr-fiu-request-deadline
    question: "Under the AMLR, how quickly must we answer an information request from the FIU?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 69 AMLR"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      All necessary information, including transaction records, within 5 working days of the request; in
      justified and urgent cases the FIU may shorten the deadline, even to less than 24 hours, and may extend it
      where justified (Art. 69(1)(b)).
  - id: amlr-group-policies
    question: "Which group-wide requirements does the AMLR impose on parent undertakings?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 16 AMLR"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      The parent undertaking must ensure that the internal-policy requirements apply in all branches and
      subsidiaries in Member States and, for EU-headquartered groups, in third countries; carry out a
      group-wide risk assessment; implement group-wide policies, procedures and controls incl. data protection
      and intra-group information sharing; establish group-level compliance functions with a group compliance
      manager and, where justified, a compliance officer, with at least annual reporting (Art. 16(1)-(3));
      third-country branches with weaker requirements are covered by Art. 17.
  - id: amlr-business-wide-risk-assessment
    question: "What must the business-wide risk assessment under the AMLR cover and how often must it be updated?"
    language: en
    regime: aml
    cross_lingual: false
    expected: ["Art. 10 AMLR"]
    seed: true
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Identification and assessment of ML/TF risks and of the risks of non-implementation and evasion of
      targeted financial sanctions, taking into account at least the Annex I variables, the Annex II/III
      factors, the supranational and national risk assessments and the customer base (Art. 10(1)); new
      products, channels, technologies and geographies are assessed beforehand (Art. 10(2)); the assessment
      is documented, kept up to date and reviewed regularly and whenever events significantly affect the risks -
      no fixed interval is stated (Art. 10(3)); drafted by the compliance officer, approved by the management
      body (Art. 10(4)).
  - id: amlr-training
    question: "Welche Schulungspflichten sieht die AMLR für Mitarbeiter vor?"
