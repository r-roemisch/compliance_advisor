      Bei Krediten, die insgesamt 1 500 000 Euro oder 10 Prozent des Kernkapitals des Instituts nach Art. 25 CRR
      überschreiten, darf das Institut den Kredit nur gewähren, wenn es sich die wirtschaftlichen Verhältnisse,
      insbesondere durch Vorlage der Jahresabschlüsse, offenlegen lässt; davon kann abgesehen werden, wenn das
