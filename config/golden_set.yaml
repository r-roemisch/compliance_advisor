      Zahlungsauslösedienste, 125 000 EUR für Zahlungsdienste nach § 1 Abs. 1 S. 2 Nr. 1-5, 350 000 EUR
      E-Geld-Institute) oder der nach der Rechtsverordnung berechnete Betrag (§ 15 Abs. 1 S. 1); bei
      Kreditgewährung angemessenes Verhältnis zu den Krediten (S. 2); vierteljährliche Meldung an BaFin und
      Bundesbank (Abs. 2), Anpassung um bis zu 20 Prozent durch die BaFin möglich.
