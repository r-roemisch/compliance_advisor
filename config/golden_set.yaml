      Nach Art. 37 Abs. 1 DSGVO, wenn eine Behörde oder öffentliche Stelle verarbeitet, die Kerntätigkeit in
      umfangreicher regelmäßiger und systematischer Überwachung betroffener Personen besteht oder in
      umfangreicher Verarbeitung besonderer Datenkategorien oder strafrechtlicher Daten; zudem, wenn Unions-
      oder mitgliedstaatliches Recht es verlangt (Abs. 4) - die deutsche Schwelle von in der Regel mindestens 20
      ständig mit automatisierter Verarbeitung beschäftigten Personen (§ 38 BDSG) ist nicht im Korpus; Stellung
      und Aufgaben in Art. 38-39.
  - id: gdpr-us-transfer
    question: "Dürfen wir Kundendaten an einen Dienstleister in den USA übermitteln?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 44 GDPR", "Art. 45 GDPR", "Art. 46 GDPR"]
    seed: false
    status: draft
    type: scenario
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Nur unter den Bedingungen des Kapitels V (Art. 44): auf Grundlage eines Angemessenheitsbeschlusses der
      Kommission (Art. 45 - für zertifizierte US-Unternehmen das EU-US Data Privacy Framework, nicht im Korpus),
      andernfalls mit geeigneten Garantien und durchsetzbaren Betroffenenrechten, insbesondere
      Standarddatenschutzklauseln oder verbindlichen internen Datenschutzvorschriften (Art. 46), oder
      ausnahmsweise nach den Ausnahmen des Art. 49 (z. B. ausdrückliche Einwilligung, Vertragserforderlichkeit).
  - id: gdpr-kyc-legal-basis
    question: "Auf welcher Rechtsgrundlage dürfen wir KYC-Daten unserer Kunden verarbeiten?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 6 GDPR", "§ 11a GwG"]
    seed: false
    status: draft
    type: cross_regime
    origin: drafted
    notes: "Cross-regime GDPR/GwG."
    answer_key: >-
      Erfüllung einer rechtlichen Verpflichtung (Art. 6 Abs. 1 Buchst. c DSGVO), deren Grundlage nach Art. 6
      Abs. 3 im mitgliedstaatlichen Recht liegt: § 11a Abs. 1 GwG erlaubt Verpflichteten die Verarbeitung
      personenbezogener Daten nur, soweit dies auf Grundlage des GwG für Zwecke der Verhinderung von Geldwäsche
      und Terrorismusfinanzierung erforderlich ist (Zweckbindung); bei Übermittlung an Aufsichtsbehörden oder die
      FIU entfallen Informationspflicht und Auskunftsrecht nach Art. 13 Abs. 3 und Art. 15 DSGVO (§ 11a Abs. 2);
      gilt entsprechend für eingeschaltete Dritte nach § 17 GwG (Abs. 3).
  - id: gdpr-retention-vs-gwg
    question: "Wie lange dürfen wir Identifizierungsdaten speichern - wie passen DSGVO-Speicherbegrenzung und GwG-Aufbewahrungspflicht zusammen?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["§ 8 GwG", "Art. 5 GDPR", "Art. 17 GDPR"]
    seed: false
    status: draft
    type: cross_regime
    origin: drafted
    notes: "Cross-regime GDPR/GwG."
    answer_key: >-
      Die Speicherbegrenzung (Art. 5 Abs. 1 Buchst. e DSGVO) und das Recht auf Löschung (Art. 17 Abs. 1) treten
      zurück, soweit die Verarbeitung zur Erfüllung einer rechtlichen Verpflichtung erforderlich ist (Art. 17 Abs.
      3 Buchst. b); nach § 8 Abs. 4 GwG sind Aufzeichnungen und Belege fünf Jahre aufzubewahren, soweit nicht
      andere gesetzliche Aufbewahrungsvorschriften eine längere Frist vorsehen; die Frist beginnt bei
      Geschäftsbeziehungen mit dem Schluss des Kalenderjahres, in dem die Geschäftsbeziehung endet, sonst mit dem
      Schluss des Kalenderjahres, in dem die Angabe festgestellt wurde; in jedem Fall sind die Unterlagen
      spätestens nach Ablauf von zehn Jahren zu vernichten.
