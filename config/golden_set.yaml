  - id: ai-credit-scoring
    question: "Is an AI system for credit scoring of natural persons a high-risk AI system?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Annex III AI Act", "Art. 6 AI Act"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    answer_key: >-
      Yes. Annex III point 5(b) lists AI systems intended to evaluate the creditworthiness of natural persons or
      establish their credit score, with the exception of systems used for detecting financial fraud; Art. 6(2)
      makes Annex III systems high-risk, subject to the Art. 6(3) derogation, which never applies where the
      system performs profiling of natural persons; a provider invoking Art. 6(3) must document its assessment
      and register under Art. 49(2) (Art. 6(4)).
  - id: ai-deployer-duties
    question: "What must deployers of high-risk AI systems do?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 26 AI Act"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Use the system in accordance with the instructions for use (Art. 26(1)); assign human oversight to persons
      with the necessary competence, training, authority and support (26(2)); ensure relevant and sufficiently
      representative input data under their control (26(4)); monitor operation, inform the provider and the
      market surveillance authority of risks and suspend use, and report serious incidents (26(5)); keep
      automatically generated logs for at least six months (26(6)); inform workers' representatives before
      workplace use (26(7)); use the provider's information for the DPIA (26(9)); inform natural persons subject
      to decisions (26(11)); cooperate with authorities (26(12)); for financial institutions, monitoring and log
      keeping may be fulfilled through financial-services governance rules (26(5)-(6)).
