      Risikotreiber auf die Risikoarten wirken; ihre Auswirkungen sind in der Wesentlichkeitsbeurteilung der
      Risikoinventur, der Risikotragfähigkeit, den Strategien und der Berichterstattung angemessen zu
      berücksichtigen, auf Basis plausibler, wissenschaftlich fundierter Szenarien mit kurz-, mittel- und
      langfristiger Sicht - ein Abstellen allein auf Datenhistorien reicht nicht (AT 2.2 Tz. 3); in Stresstests
      sind wesentliche Umweltrisiken zu berücksichtigen, ergänzt um Resilienzanalysen mit langem Zeithorizont,
