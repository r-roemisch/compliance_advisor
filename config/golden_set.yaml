    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/2111-employees-subject-professional-training-requirements_en
    notes: "Answer provided by the European Commission."
    answer_key: >-
      Only management responsible for distribution and persons directly involved in insurance distribution, i.e.
      those who personally perform or supervise activities within the Art. 2(1)(1) definition (advising on,
      proposing or concluding contracts, assisting in their administration and performance, in particular claims)
      (Art. 10(2) IDD); accounting or administrative staff who do not perform such activities need not complete
      the 15 hours, whereas back-office staff who personally assist in the administration and performance of
      existing contracts (e.g. informing policyholders about their contract) do perform a distribution activity
      within Art. 2(1)(1) and are therefore 'directly involved'.
  - id: idd-demands-needs
    question: "What is the 'demands and needs' test, and when does it apply?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 20 IDD"]
    seed: false
    status: draft
    type: definition
    origin: drafted
    answer_key: >-
      Before the conclusion of any insurance contract the distributor must specify, on the basis of information
      obtained from the customer, the customer's demands and needs and give objective information about the
      product in a comprehensible form; any proposed contract must be consistent with those demands and needs;
      where advice is given, a personalised recommendation explaining why the product best meets them
      (Art. 20(1)); detail modulated by product complexity and customer type (20(2)); 'fair and personal
      analysis' requires analysing a sufficiently large number of contracts (20(3)); IPID for non-life products
      (20(5)-(8)).
  - id: idd-demands-needs-signature
    question: "Must the demands-and-needs statement be signed by the customer and countersigned by us as distributor?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 20 IDD", "Art. 23 IDD"]
    seed: false
    status: draft
    type: scenario
    origin: EIOPA Q&A 2525
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/2525-signature-requirements-relating-demands-and-needs-statement_en
    notes: "EIOPA Final; national law may add formal requirements (e.g. § 6 VVG, not in the Corpus)."
    answer_key: >-
      No. The IDD requires no signature by either party: the statement must specify the demands and needs on the
      basis of the information obtained and the proposed contract must be consistent with them (Art. 20(1));
      communication is on paper by default, with durable-medium and website derogations and a free paper copy on
      request (Art. 23(1)-(3)); a signature never shifts responsibility for the assessment to the customer.
  - id: idd-large-risks
    question: "As a corporate broker placing large or complex risks, can our demands-and-needs documentation consist of the documented email exchange with the client instead of a questionnaire?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 22 IDD", "Art. 20 IDD"]
    seed: false
    status: draft
    type: scenario
    origin: EIOPA Q&A 2694
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/2694-format-demands-and-needs-test-documentation-case-large-risks_en
    answer_key: >-
      For large risks (Art. 2(1)(16)) the Art. 20 information duties do not apply at all (Art. 22(1)). Otherwise
      the specification must precede conclusion and may be adjusted to product complexity and customer type
      (Art. 20(2)); no format is prescribed, so documented emails can evidence the assessment if they show the
      distributor performed it; Art. 23 communication rules apply and Member States may impose stricter
      formats.
  - id: idd-remuneration-disclosure
    question: "Must insurance distributors disclose how they are remunerated?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 19 IDD"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Yes. In good time before conclusion an intermediary must disclose whether it advises on the basis of a
      fair and personal analysis or is contractually bound (Art. 19(1)(c)), the nature of the remuneration
      received for the contract (19(1)(d)) and whether it works on a fee, a commission, another type of
      remuneration or a combination (19(1)(e)); insurance undertakings disclose the nature of the remuneration
      of their employees (19(4)); remuneration must not conflict with the duty to act in the customer's best
      interests (Art. 17(3)).
  - id: idd-commissions-conflict
    question: "Do commissions we receive for distributing insurance-based investment products automatically constitute a conflict of interest under the IDD?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 29 IDD", "Art. 27 IDD", "Art. 17 IDD"]
    seed: false
    status: draft
    type: scenario
    origin: EIOPA Q&A 2271
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/2271-whether-commissions-line-article-301-idd-constitute-conflict-interest_en
    notes: "Answer by the European Commission; the inducement criteria of Delegated Regulation 2017/2359 are not in the Corpus."
    answer_key: >-
      No. A commission that meets both conditions of Art. 29(2) - no detrimental impact on the quality of the
      service and no impairment of the duty to act honestly, fairly and professionally in the customer's best
      interests (Art. 17(1)) - is not a conflict of interest under Arts. 27-28; commission rates that differ
      between insurers can be detrimental if they incentivise recommending the highest-paying product; Member
      States may restrict or prohibit commissions (Art. 29(3)).
  - id: idd-ibip-suitability
    question: "When must we carry out a suitability assessment for insurance-based investment products?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 30 IDD"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      When advice is given on an IBIP: obtain information on the customer's knowledge and experience, financial
      situation incl. ability to bear losses and investment objectives incl. risk tolerance, to recommend
      suitable products (Art. 30(1)); without advice an appropriateness assessment based on knowledge and
      experience, with a warning if the product is not appropriate (30(2)); Member States may allow
      execution-only sales of non-complex IBIPs at the customer's initiative with a warning (30(3)).
  - id: idd-cross-selling
    question: "What rules apply when an insurance product is sold together with another product or service?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 24 IDD"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      The distributor must inform the customer whether the components can be bought separately and, if so,
      describe each and give separate evidence of costs and charges (Art. 24(1)), explain how the combination
      modifies risk or coverage (24(2)); where insurance is ancillary to a non-insurance good or service, the
      customer must be offered the possibility to buy that good or service separately, except where it is
      ancillary to an investment service, a credit agreement or a payment account (24(3)); demands and needs
      must be specified for the insurance components (24(6)).
  - id: idd-pog-tailor-made
    question: "Do the product oversight and governance requirements also apply to tailor-made insurance products designed for a single corporate customer?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 25 IDD"]
    seed: false
    status: draft
    type: applicability
    origin: EIOPA Q&A 2265
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/2265-pog-requirements-article-25-idd-relation-size-target-market_en
    notes: "Answer by the European Commission."
    answer_key: >-
      Yes. Art. 25(1) covers every insurance product manufactured for sale to customers, regardless of the
      number of customers it is designed for; the approval process must be proportionate and appropriate to the
      nature of the product (Art. 25(1) second subparagraph), so the depth of the process may be adjusted, but
      tailor-made products are not excluded; only large-risk products fall outside (Art. 25(4)).
  - id: vag-remuneration
    question: "Welche Anforderungen gelten für das Vergütungssystem eines Versicherungsunternehmens?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["§ 25 VAG", "Art. 275 Delegated Regulation (EU) 2015/35"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "The MaGo has no remuneration section; the VersVergV is not in the Corpus."
    answer_key: >-
      Vergütungssysteme für Geschäftsleiter, Mitarbeiter und Aufsichtsratsmitglieder müssen angemessen,
      transparent und auf eine nachhaltige Entwicklung des Unternehmens ausgerichtet sein (§ 25 Abs. 1 VAG);
      gruppenweite Sicherstellung durch das oberste Mutterunternehmen (Abs. 3); bei Nichtbedeckung der SCR soll
      die BaFin variable Vergütungen begrenzen oder untersagen (Abs. 4); durch Tarifvertrag geregelte Vergütung
      ist ausgenommen (Abs. 5). Art. 275 DR: Vergütungsleitlinie im Einklang mit Geschäfts- und Risikostrategie,
      keine Anreize zur Risikonahme über die Toleranzgrenzen hinaus, Vergütungsausschuss soweit angemessen (Art.
      275(1)); für Geschäftsleitung, Schlüsselfunktionen und Risikoträger ausgewogenes Verhältnis fest/variabel,
      Aufschub eines wesentlichen Teils um mindestens drei Jahre, Unabhängigkeit der Kontrollfunktionen (Art.
      275(2)); Nachhaltigkeitsrisiken (Art. 275(4)).
  - id: sii-remuneration-collective-agreements
    question: "Are remuneration terms set in collective bargaining agreements exempt from the Solvency II remuneration requirements?"
    language: en
    regime: insurance
    cross_lingual: true
    expected: ["Art. 275 Delegated Regulation (EU) 2015/35", "§ 25 VAG"]
    seed: false
    status: draft
    type: scenario
    origin: EIOPA Q&A 1139
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/1139_en
    notes: "EIOPA Q&A 1139. v3: '§ 25 VAG' added because Abs. 5 contains the national Tarifvertrag exemption a German compliance officer will ask about."
    answer_key: >-
      No. Collective bargaining arrangements are not exempt: they may shape the remuneration policy only within
      the EU rules and must not circumvent them, so their terms must reflect Art. 275 DR (sound and effective risk
      management); termination payments must reflect performance over the whole period of activity and must not
      reward failure (Art. 275(2)(f)), regardless of collective agreements or national termination-pay rules. For
      German undertakings, § 25 Abs. 5 VAG exempts remuneration agreed in a Tarifvertrag (or in a Betriebs- or
      Dienstvereinbarung based on one) from § 25 Abs. 1, 3 and 4 VAG only; the directly applicable Art. 275 DR is
      not affected by that exemption.
  - id: vag-risk-management-system
    question: "Was muss das Risikomanagementsystem eines Versicherers umfassen?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["§ 26 VAG", "Art. 44 Solvency II", "Art. 259 Delegated Regulation (EU) 2015/35", "Art. 260 Delegated Regulation (EU) 2015/35"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "MaGo 11 (Risikomanagementsystem) is the supervisory detail - optional label."
    answer_key: >-
      Ein wirksames, in Organisationsstruktur und Entscheidungsprozesse eingebundenes System mit den Strategien,
      Prozessen und Meldeverfahren, um alle Risiken einzeln und aggregiert zu identifizieren, bewerten,
      überwachen, steuern und berichten (§ 26 Abs. 1 VAG; Art. 44(1) SII), einschließlich Risikostrategie,
      Risikomanagementleitlinien mit Toleranzlimits und Stresstests (Art. 259 DR); Mindestbereiche: Zeichnung
      und Rückstellungsbildung, Aktiv-Passiv-Management, Kapitalanlagen inkl. Derivate, Liquiditäts- und
      Konzentrationsrisiko, operationelles Risiko, Rückversicherung (§ 26 Abs. 5; Art. 44(2); Art. 260 DR, dort
      zusätzlich latente Steuern und Nachhaltigkeitsrisiken); unabhängige Risikocontrollingfunktion (§ 26
      Abs. 8; Art. 44(4)).
  - id: sii-orsa-ltg
    question: "Must our ORSA supervisory report present the forward-looking SCR both with and without long-term guarantee measures such as the volatility adjustment?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 45 Solvency II", "Art. 306 Delegated Regulation (EU) 2015/35"]
    seed: false
    status: draft
    type: scenario
    origin: EIOPA Q&A 3261
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/3261_en
    notes: "EIOPA Q&A 3261; Art. 306 DR ('Own-risk and solvency assessment supervisory report') and Art. 45(2a) confirmed in the second-pass review."
    answer_key: >-
      Yes. The ORSA supervisory report must present the quantitative and qualitative results of the assessment
      under Art. 45 (Art. 306 DR); Art. 45(1)(b) covers continuous compliance with the capital requirements under
      baseline and stressed scenarios, and Art. 45(2a) requires that assessment to be performed both with and
      without the matching adjustment, volatility adjustment and transitional measures, so both views belong in
      the report.
  - id: vag-notifications
    question: "Welche Anzeigepflichten gegenüber der BaFin bestehen bei Änderungen in der Geschäftsleitung oder bei Schlüsselfunktionen?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["§ 47 VAG", "Art. 42 Solvency II"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Unverzüglich anzuzeigen sind die Bestellung eines Aufsichtsratsmitglieds sowie die Absicht der Bestellung
      eines Geschäftsleiters oder einer für eine Schlüsselfunktion verantwortlichen Person mit den für die
      Beurteilung von Zuverlässigkeit und fachlicher Eignung wesentlichen Angaben (§ 47 Nr. 1 VAG) und das
      Ausscheiden dieser Personen bzw. der Entzug der Vertretungsbefugnis mit den Gründen (Nr. 2); daneben u. a.
      Satzungsänderungen, bedeutende Beteiligungen, enge Verbindungen (Nr. 3-7) und Ausgliederungen (Nr. 8-9).
      Art. 42(2)-(3) SII verlangt die Anzeige jeder Änderung und der Ersetzung einer Person, die die
      Anforderungen nicht mehr erfüllt.
  - id: vag-small-insurers
    question: "Welche Erleichterungen gelten für kleine Versicherungsunternehmen, die nicht unter Solvency II fallen?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["§ 211 VAG", "§ 212 VAG", "Art. 4 Solvency II"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    notes: "Temporal: the 17.1.2025 consolidation shows the inflation-adjusted thresholds (EUR 5.4m / 26.6m); Directive (EU) 2025/2 raises them to EUR 15m / 50m from 30.1.2027 and is not in the Corpus."
    answer_key: >-
      Kleine Versicherungsunternehmen sind Erstversicherer, deren Bruttobeitragseinnahmen und
      versicherungstechnische Bruttorückstellungen die Beträge des Art. 4 SII (derzeit EUR 5,4 Mio. Prämien,
      EUR 26,6 Mio. Rückstellungen) nicht überschreiten, kein Haftpflicht-, Kredit- oder Kautionsgeschäft und
      kein grenzüberschreitendes Geschäft betreiben und keine Pensions- oder Sterbekasse sind (§ 211 Abs. 1);
      Einstufung nach drei aufeinanderfolgenden Jahren, Verzicht auf Antrag (Abs. 2-4). Für sie gelten die
      Vorschriften für Erstversicherer mit Ausnahmen (§ 212): u. a. keine ORSA, keine Compliance-,
      Revisions- und versicherungsmathematische Funktion, kein SFCR, keine Solvency-II-Bewertung und
      -Kapitalanforderungen, stattdessen die Anforderungen der §§ 213 ff.
  - id: sii-group-supervision
    question: "Wann unterliegt eine Versicherungsgruppe der Gruppenaufsicht?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["Art. 213 Solvency II", "§ 245 VAG"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    answer_key: >-
      Zusätzlich zur Einzelaufsicht für Versicherungsunternehmen, die beteiligtes Unternehmen mindestens eines
      Versicherungsunternehmens sind, deren Mutterunternehmen eine Versicherungs-Holdinggesellschaft oder
      gemischte Finanzholdinggesellschaft mit Sitz im EWR ist, deren Mutterunternehmen eine solche Holding oder
      ein Versicherer mit Sitz in einem Drittstaat ist, oder deren Mutterunternehmen eine gemischte
      Versicherungs-Holdinggesellschaft ist (Art. 213(2)(a)-(d) SII; § 245 Abs. 2 Nr. 1-4 VAG); keine
      Gruppenaufsicht, wenn die Gruppe nur durch kleine Versicherungsunternehmen, Sterbe- oder Pensionskassen
      entsteht (§ 245 Abs. 5).
  - id: sii-intragroup-claims-outsourcing
    question: "Two insurers of our group set up a joint service company to handle claims settlement for both - is that outsourcing under Solvency II?"
    language: en
    regime: insurance
    cross_lingual: true
    expected: ["Art. 13 Solvency II", "Art. 49 Solvency II", "Art. 274 Delegated Regulation (EU) 2015/35", "13.6 MaGo"]
    seed: false
    status: draft
    type: scenario
    origin: EIOPA Q&A 1801
    source_url: https://www.eiopa.europa.eu/qa-regulation/questions-and-answers-database/1801_en
    notes: "EIOPA's case concerned an EEIG; the logic is the same for any group service company. MaGo 13.6 covers konzern-/gruppeninterne Ausgliederung."
    answer_key: >-
      Yes, as a rule. Outsourcing is any arrangement under which a service provider performs a process, service or
      activity the undertaking would otherwise perform itself (Art. 13(28) SII); a group entity with its own legal
      personality is a service provider, so Art. 49 SII and Art. 274 DR apply, including the written agreement and
      supervisory access rights. Claims and benefits processing ('Leistungsbearbeitung') is generally an important
      function (MaGo Rn. 218); for intra-group outsourcing the degree of control and influence over the provider
      is taken into account (Art. 274(2) DR), and MaGo 13.6 (Rn. 234-240) applies the full outsourcing regime
      group-internally - no less care or monitoring and no automatic 'not significant', but case-by-case
      simplifications such as an SLA as the written agreement or a lighter pre-selection review.
  - id: sii-rsr
    question: "What is the Regular Supervisory Report, and how often must it be submitted?"
    language: en
    regime: insurance
    cross_lingual: false
    expected: ["Art. 304 Delegated Regulation (EU) 2015/35", "Art. 312 Delegated Regulation (EU) 2015/35"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "v3: 'Art. 35 Solvency II' removed - it is the general reporting basis and neither defines the RSR nor fixes its frequency."
    answer_key: >-
      The narrative report to the supervisor following the SFCR structure with the additional information of
      Arts. 307-311 DR and the information the undertaking was allowed not to disclose publicly, plus a summary
      of material changes (Art. 304 DR), supplied as part of the information under Art. 35 SII. Submitted in full
      at least every three years, after the transitional period no later than 14 weeks after year-end, annually
      if the supervisor requires it; in other years a report on material changes within the same deadline
      (Art. 312(1)(a), (2), (3)); the ORSA supervisory report is due within two weeks of concluding the
      assessment (Art. 312(1)(b)).
  - id: mago-dora-interplay
    question: "Gilt DORA neben den MaGo-Anforderungen an das IT-Risikomanagement von Versicherern?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["Art. 2 DORA", "3 MaGo"]
    seed: false
    status: draft
    type: cross_regime
    origin: drafted
    notes: "The MaGo 09/2025 has no IT chapter any more; section 3 Rn. 11 refers to DORA and the AI Act, section 9.5 links automated processes to them."
    answer_key: >-
      Ja. Versicherungs- und Rückversicherungsunternehmen unterliegen DORA unmittelbar (Art. 2(1)(n) DORA); im
      Versicherungssektor ausgenommen sind nur kleine Versicherungsunternehmen im Sinne von Art. 4 SII (Art.
      2(3)(b)) und Kleinst-/KMU-Vermittler (Art. 2(3)(e)). Die MaGo 2025 stellt in Abschnitt 3 (Rn. 11) klar, dass
      DORA und die KI-Verordnung die sektorspezifischen Anforderungen an IKT- und KI-Risiken regeln, während die
      MaGo nur die allgemeinen Governance-Prozesse enthält; Abschnitt 9.5 (Automatisierte Geschäftsabläufe)
      verknüpft beide; IT-Risiken bleiben als operationelle Risiken Teil des Risikomanagementsystems (Rn. 168).
  - id: mago-proportionality
    question: "Wie konkretisiert die MaGo das Proportionalitätsprinzip?"
    language: de
    regime: insurance
    cross_lingual: false
    expected: ["4 MaGo"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "v3: answer key aligned to the wording of Rn. 13-14 (small size can indicate a weaker risk profile 'und umgekehrt')."
    answer_key: >-
      Die Anforderungen sind in einer Art und Weise zu erfüllen, die der Art, dem Umfang und der Komplexität der
      Risiken des Unternehmens angemessen ist (MaGo Abschnitt 4, Rn. 13-14, unter Verweis auf § 296 Abs. 1 VAG);
      maßgeblich ist das individuelle Risikoprofil: geringe Größe kann ein Indikator für ein schwächer
      ausgeprägtes Risikoprofil sein - und umgekehrt; bei der Personalausstattung zählt nicht die Zahl der
      vorhandenen Beschäftigten, sondern der tatsächliche Bedarf einschließlich externer Beschäftigter bei
      Dienstleistern (Rn. 13). Proportionalität wirkt sich darauf aus, wie Anforderungen erfüllt werden können:
      ein schwächer ausgeprägtes Risikoprofil kann zu Umsetzungserleichterungen führen, ein stärker ausgeprägtes
      lässt die Anforderungen an die Umsetzung wachsen; die Einschätzung ist bei veränderten Umständen zu
      überprüfen (Rn. 14).
  - id: mago-outsourcing-officer
    question: "Wann müssen wir eine Ausgliederungsbeauftragte oder einen Ausgliederungsbeauftragten benennen, und welche Anforderungen gelten für diese Person?"
    language: de
    regime: insurance
    cross_lingual: false
    expected: ["13.5 MaGo"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "Rn. wording read in BaFin's English version of the MaGo (identical numbering)."
    answer_key: >-
      Bei jeder Ausgliederung von Schlüsselfunktionen oder Schlüsselaufgaben (MaGo 13.5, Rn. 228); die oder der
      Ausgliederungsbeauftragte ist verantwortliche Person im Sinne von § 47 Nr. 1 VAG (Anzeige an die BaFin),
      überwacht und beurteilt die ordnungsgemäße Erbringung durch den Dienstleister unabhängig und objektiv, kann
      ein Mitglied der Geschäftsleitung (bei Funktionstrennung und ausreichender Zeit) oder eine Person unterhalb
      der Geschäftsleitung sein, nicht aber die zuständige Person beim Dienstleister (Rn. 225-233).
  - id: vag-actuarial-function
    question: "Welche Aufgaben hat die versicherungsmathematische Funktion?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["§ 31 VAG", "Art. 48 Solvency II", "Art. 272 Delegated Regulation (EU) 2015/35", "10.3 MaGo"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Koordinierung der Berechnung der versicherungstechnischen Rückstellungen, Sicherstellung der Angemessenheit
      von Methoden, Modellen und Annahmen, Prüfung von Umfang und Qualität der Daten, Vergleich der besten
      Schätzwerte mit Erfahrungswerten, Unterrichtung des Vorstands über Verlässlichkeit und Angemessenheit
      (§ 31 Abs. 1 Nr. 1-6 VAG; Art. 48(1)(a)-(f) SII); Stellungnahme zur Zeichnungs- und Annahmepolitik und zur
      Angemessenheit der Rückversicherung, Beitrag zum Risikomanagementsystem und zur ORSA (§ 31 Abs. 2;
      Art. 48(1)(g)-(i)); Art. 272 DR konkretisiert und verlangt einen jährlichen schriftlichen Bericht an den
      Vorstand (Art. 272(8)); MaGo 10.3 (Rn. 106-143).
  - id: sii-internal-audit-reporting
    question: "How often must internal audit report to the board, and may the head of internal audit also be responsible for another key function?"
    language: en
    regime: insurance
    cross_lingual: true
    expected: ["Art. 271 Delegated Regulation (EU) 2015/35", "10.4 MaGo"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Internal audit must maintain a risk-based multi-year audit plan reported to the AMSB, issue recommendations
      and submit a written report on findings and recommendations at least annually, and verify the follow-up
      (Art. 271(3)(a)-(e) DR); persons carrying out internal audit may not assume responsibility for any other
      function unless, cumulatively, this is proportionate to the nature, scale and complexity of the risks,
      creates no conflict of interest and a separate solution would be disproportionately costly (Art.
      271(1)-(2)); MaGo 10.4 (Rn. 144-153) stresses independence of all units incl. the head and direct, unaltered
      reporting to the full board.

  # --- Banking ---
  - id: kwg-25a
    question: "What does § 25a KWG require from a bank's business organisation?"
    language: en
    regime: banking
    cross_lingual: true
    expected: ["§ 25a KWG"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "Names the Provision explicitly; tests the direct lookup (English question, German Source)."
    answer_key: >-
      A proper business organisation ensuring compliance with legal requirements and business needs, for which
      the Geschäftsleiter are responsible (§ 25a Abs. 1): a sustainability-oriented business strategy and a
      consistent risk strategy reviewed at least every two years, procedures to determine and ensure
      Risikotragfähigkeit incl. stress scenarios, an internal control system with an independent risk control
      and compliance function and an independent internal audit, adequate staffing and technical resources,
      data management capacity, emergency planning for IT systems and appropriate, transparent remuneration
      systems (Abs. 1 Satz 3 Nr. 1-6), plus documentation (five years) and a whistleblowing process; ESG risks
      are explicitly included; the MaRisk concretise this (AT 1 Tz. 1).
  - id: marisk-compliance
    question: "Welche Aufgaben hat die Compliance-Funktion eines Kreditinstituts nach den MaRisk?"
    language: de
    regime: banking
    cross_lingual: false
    expected: ["AT 4.4.2 MaRisk"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Sie wirkt auf die Implementierung wirksamer Verfahren zur Einhaltung der wesentlichen rechtlichen Regelungen
      und entsprechender Kontrollen hin und unterstützt und berät die Geschäftsleitung (AT 4.4.2 Tz. 1); sie
      identifiziert risikobasiert regelmäßig die wesentlichen rechtlichen Regelungen (Tz. 2), ist unabhängig von
      Markt- und Handelsbereichen und grundsätzlich direkt der Geschäftsleitung unterstellt, Kombination mit
      anderen geeigneten Funktionen möglich, z. B. Geldwäschebeauftragter oder IKT-Risikokontrollfunktion, nicht
      aber Geldwäsche- und Datenschutzbeauftragter miteinander (Erläuterung zu Tz. 3); ein Compliance-Beauftragter
      ist zu benennen (Tz. 4); uneingeschränkte Informationsrechte (Tz. 5); Bericht mindestens jährlich sowie
      anlassbezogen an die Geschäftsleitung, mit Hinweisen auf Defizite und Gegenmaßnahmen, weitergegeben an die
      Interne Revision (Tz. 6); das Aufsichtsorgan erhält den Bericht nach AT 3.2 Tz. 2.
  - id: marisk-scope
    question: "Gilt die MaRisk für bedeutende Institute unter direkter EZB-Aufsicht?"
    language: de
    regime: banking
    cross_lingual: false
    expected: ["AT 2.1 MaRisk"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    notes: "Temporal: since the 9th amendment (06/2026) significant institutions are outside the scope."
    answer_key: >-
      Nein. Die MaRisk 06/2026 gelten für alle Institute im Sinne von § 1 Abs. 1b KWG bzw. § 53 Abs. 1 KWG, sofern
      sie nicht als bedeutende Institute im Sinne von Art. 6 der SSM-Verordnung der direkten EZB-Aufsicht
      unterliegen (AT 2.1 Tz. 1); erfasst sind daneben CRD-Drittstaatenzweigstellen nach § 53c Abs. 1 KWG und die
      Auslandszweigniederlassungen deutscher Institute, nicht aber EWR-Zweigniederlassungen nach § 53b KWG (alle
      Tz. 1); Finanzdienstleistungsinstitute und große Wertpapierfirmen unter Voraussetzungen (Tz. 2); Anwendung
      auf Gruppenebene (Tz. 3).
  - id: crd-governance
    question: "What internal governance arrangements must credit institutions have under the CRD?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 74 CRD"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "The question says 'under the CRD', so § 25a KWG is not a required label."
    answer_key: >-
      Robust governance arrangements: a clear organisational structure with well-defined, transparent and
      consistent lines of responsibility; effective processes to identify, manage, monitor and report risks,
      including ESG risks over the short, medium and long term; adequate internal control mechanisms incl. sound
      administrative and accounting procedures; network and information systems set up and managed in
      accordance with DORA; and gender-neutral remuneration policies consistent with sound risk management
      (Art. 74(1)); proportionate to the institution's risks (74(2)); EBA guidelines (74(3)); transposed in § 25a
      KWG.
  - id: crr-min-ratios
    question: "Welche Mindestkapitalquoten müssen wir nach der CRR einhalten?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["Art. 92 CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Harte Kernkapitalquote 4,5 %, Kernkapitalquote 6 %, Gesamtkapitalquote 8 % des Gesamtrisikobetrags sowie
      eine Verschuldungsquote von 3 % (Art. 92(1)(a)-(d)); G-SRI halten zusätzlich einen Puffer der
      Verschuldungsquote (Art. 92(1a)); seit CRR III ist der Gesamtrisikobetrag der höhere Wert aus dem
      ungefloorten Betrag und 72,5 % des Standardansatz-Betrags (Output Floor, Art. 92(3), Übergang Art. 465);
      Kapitalpuffer kommen nach CRD/KWG hinzu.
  - id: crr-large-exposures
    question: "What is the large exposure limit, and when does an exposure count as large?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 395 CRR", "Art. 392 CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      An exposure to a client or group of connected clients is large when it is 10 % or more of Tier 1 capital
      (Art. 392); after credit risk mitigation it must not exceed 25 % of Tier 1 capital, or EUR 150 million if
      higher where the client or a member of the group is an institution, provided exposures to the
      non-institution members stay within 25 %; where EUR 150 million is the higher figure, the institution sets a
      reasonable limit under its Art. 81 CRD concentration-risk policies not exceeding 100 % of Tier 1, and
      competent authorities may set a limit below EUR 150 million; a G-SII's exposure to another G-SII is limited
      to 15 % (Art. 395(1)); the limits apply at all times (395(3)); trading-book excesses under 395(5).
  - id: crr-connected-clients
    question: "We have exposures to several entities of one economic group, some of them outside our prudential scope of consolidation - must we treat them as one group of connected clients for the large exposure limit?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 4 CRR", "Art. 395 CRR", "Art. 400 CRR"]
    seed: false
    status: draft
    type: scenario
    origin: EBA Q&A 2018_3665
    source_url: https://eba.europa.eu/single-rule-book-qa/qna/view/publicId/2018_3665
    notes: "EBA Final 21/12/2018, confirmed still relevant 2021."
    answer_key: >-
      Yes. Clients linked by control or economic dependency form a group of connected clients (Art. 4(1)(39))
      regardless of the prudential scope of consolidation, and the 25 % limit of Art. 395(1) applies to the
      group; exposures exempt under Art. 400(1) or (2) (e.g. intragroup exposures under 400(2)(c)) or under
      national exemptions are deducted from the group exposure but do not take the entity out of the connected
      group.
  - id: crr-npe-vs-default
    question: "Does the 20 % threshold for non-performing exposures in Art. 47a CRR replace the materiality threshold for default, or do both apply?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 47a CRR", "Art. 178 CRR"]
    seed: false
    status: draft
    type: definition
    origin: EBA Q&A 2020_5528
    source_url: https://eba.europa.eu/single-rule-book-qa/qna/view/publicId/2020_5528
    notes: "EBA Final 30/07/2021; the materiality threshold itself is in Delegated Regulation 2018/171, not in the Corpus. v3: 'Art. 36 CRR' removed - Art. 36(1)(m) only names the deduction and cannot answer the question alone."
    answer_key: >-
      Both apply, for different purposes. The materiality threshold indicates default under Art. 178 at obligor
      level (facility level for retail where applied); Art. 47a(3) determines non-performing exposures for the
      minimum loss coverage deduction under Art. 36(1)(m): where more-than-90-days-past-due on-balance-sheet
      exposures exceed 20 % of an obligor's on-balance-sheet exposures, all exposures to that obligor are
      treated as non-performing. 'Defaulted' and 'non-performing' are therefore not synonyms.
  - id: crr-default-definition
    question: "Ab wann gilt ein Kredit nach der CRR als ausgefallen?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["Art. 178 CRR"]
    seed: false
    status: draft
    type: definition
    origin: drafted
    notes: "Cross-lingual. The former 180-day option is no longer in the mirrored CRR III text."
    answer_key: >-
      Wenn das Institut es als unwahrscheinlich ansieht, dass der Schuldner seine Verbindlichkeiten ohne
      Rückgriff auf Maßnahmen wie die Verwertung von Sicherheiten vollständig begleicht, oder wenn eine
      wesentliche Verbindlichkeit mehr als 90 Tage überfällig ist (Art. 178(1)); bei Retailforderungen auf Ebene
      der einzelnen Fazilität möglich; die Wesentlichkeitsschwelle legt die zuständige Behörde nach den EBA-RTS
      fest (Art. 178(2)(d)); Indikatoren für die Unwahrscheinlichkeit der Begleichung (Zinsverzicht,
      wesentliche Risikoanpassung, Forbearance mit Verlust, Insolvenzantrag) in Art. 178(3); Rückkehr in den
      Nicht-Ausfall nach Art. 178(5).
  - id: crr-lcr
    question: "Welche Liquiditätsdeckungsquote müssen wir einhalten?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["Art. 412 CRR", "Art. 460 CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual. v2: '§ 11 KWG' removed (general liquidity rule only, does not state the LCR); Art. 460 added because Art. 412(1) itself does not state the 100 %."
    answer_key: >-
      Liquide Aktiva müssen die Netto-Liquiditätsabflüsse unter Stress über 30 Tage decken; in Stressphasen
      dürfen sie genutzt werden (Art. 412(1), (3)); die Mindestquote von 100 % gilt seit dem 1. Januar 2018 nach
      der Stufenfolge 60/70/80/100 % (Art. 460(2)); die Einzelheiten regelt die Delegierte Verordnung (EU)
      2015/61, die nicht im Korpus ist; § 11 KWG enthält nur das allgemeine Liquiditätsgebot und
      BaFin-Befugnisse für zusätzliche Anforderungen.
  - id: crr-leverage-ratio
    question: "What minimum leverage ratio must an institution maintain?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 92 CRR", "Art. 429 CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      3 % (Art. 92(1)(d)); the leverage ratio is Tier 1 capital divided by the total exposure measure, calculated
      at the reporting reference date (Art. 429(2)-(3)); the exposure measure sums on-balance-sheet assets,
      derivatives, SFT add-ons, off-balance-sheet items and unsettled regular-way trades (429(4)); G-SIIs hold
      an additional leverage ratio buffer of 50 % of their G-SII buffer rate (Art. 92(1a)).
  - id: crr-pillar3-frequency
    question: "How often must we publish Pillar 3 disclosures?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 433 CRR", "Art. 433a CRR", "Art. 433b CRR", "Art. 433c CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      Annual disclosures with the financial statements, semi-annual and quarterly ones with the financial reports
      for the period (Art. 433; since CRR III published centrally by the EBA). Large institutions disclose
      everything annually, a defined list semi-annually and, quarterly, the key metrics (Art. 447), the own funds
      requirement items of Art. 438(d), (da), (h) and the LCR information of Art. 451a(2); large institutions that
      are neither G-SIIs nor listed disclose the key metrics only semi-annually (Art. 433a(1)-(2)); small and
      non-complex institutions a reduced list annually, non-listed ones only key metrics and ESG information (Art.
      433b); other institutions everything annually and key metrics semi-annually, non-listed ones a reduced list
      annually (Art. 433c).
  - id: crr-nsfr
    question: "What is the net stable funding ratio requirement?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 413 CRR", "Art. 428b CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      Long-term assets and off-balance-sheet items must be adequately met with stable funding under normal and
      stressed conditions (Art. 413(1)); the NSFR is available stable funding divided by required stable
      funding and must be at least 100 %; if it falls below, the institution must restore it and Art. 414
      applies (Art. 428b(1)-(3)); a simplified NSFR exists for small and non-complex institutions (Art. 428ai
      ff.).
  - id: crr-op-risk-crr3
    question: "How are own funds requirements for operational risk calculated since CRR III?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 312 CRR", "Art. 313 CRR", "Art. 314 CRR"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "The 12/15/18 % coefficient table of Art. 313 is an image in the mirrored text and was confirmed from a secondary source only."
    answer_key: >-
      Through a single standardised approach: the own funds requirement equals the business indicator component
      (Art. 312), computed from the business indicator - the three-year averages of the interest, leases and
      dividend component, the services component and the financial component (Art. 314) - with marginal
      coefficients of 12 % up to EUR 1 bn, 15 % between EUR 1 bn and EUR 30 bn and 18 % above (Art. 313);
      internal models and a loss multiplier are no longer used; institutions with a business indicator of at
      least EUR 750 million calculate the annual operational risk loss and keep a loss data set (Art. 316-317).
  - id: crr-op-risk-loss-data
    question: "Ab welcher Größe müssen wir für das operationelle Risiko Verlustdaten erheben und einen jährlichen Verlust berechnen?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["Art. 316 CRR", "Art. 317 CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Institute mit einem Geschäftsindikator von mindestens 750 Mio. EUR müssen den durch operationelle Risiken
      bedingten jährlichen Verlust aus Nettoverlusten oberhalb der Schwellen des Art. 319 berechnen; die
      zuständige Behörde kann Institute mit einem Geschäftsindikator bis 1 Mrd. EUR bei unverhältnismäßigem
      Aufwand befreien (Art. 316); dazu ist ein Verlustdatensatz zu führen (Art. 317 ff.).
  - id: crr-output-floor
    question: "What is the output floor, and how is it phased in?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 92 CRR", "Art. 465 CRR"]
    seed: false
    status: draft
    type: temporal
    origin: drafted
    answer_key: >-
      The total risk exposure amount is the higher of the un-floored amount and 72.5 % of the standardised
      amount (Art. 92(3)); during the transition the factor is 50 % in 2025, 55 % in 2026, 60 % in 2027, 65 % in
      2028 and 70 % in 2029, so 72.5 % applies in full from 1 January 2030 (Art. 465(1)); Art. 465 also holds
      temporary reliefs, e.g. for unrated corporates and residential mortgages, and a cap on the increase of the
      total risk exposure amount until end-2029.
  - id: crr-large-exposure-reporting
    question: "How often do we have to report our large exposures to the competent authority, and what must the report contain?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 394 CRR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      At least semi-annually: every large exposure, including those exempt from the Art. 395(1) limit, with the
      client or group of connected clients, the exposure value before and after credit risk mitigation and the
      type of funded or unfunded credit protection used (Art. 394(1)(a)-(d)), plus the 20 largest exposures on a
      consolidated basis, consolidated exposures of EUR 300 million or more that are below 10 % of Tier 1 capital,
      and the ten largest exposures to institutions and to shadow banking entities (Art. 394(2)); frequency at
      least semi-annually (Art. 394(3)).
  - id: crd-directorships
    question: "How many directorships may a member of the management body of a significant institution hold?"
    language: en
    regime: banking
    cross_lingual: true
    expected: ["Art. 91 CRD", "§ 25c KWG", "§ 25d KWG"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      Either one executive and two non-executive directorships, or four non-executive directorships;
      directorships within the same group, institutional protection scheme or qualifying-holding undertakings
      count as one; non-commercial mandates are disregarded; the competent authority may authorise one
      additional non-executive directorship (Art. 91(3)-(6)); in Germany § 25c Abs. 2 KWG (Geschäftsleiter of
      bedeutende Institute: no further management mandate and at most two supervisory mandates) and § 25d Abs. 3
      KWG (supervisory board members: at most four supervisory mandates or one management plus two supervisory
      mandates), § 25d Abs. 3a for other institutions (five).
  - id: crd-variable-remuneration-cap
    question: "Welche Obergrenze gilt für die variable Vergütung von Risikoträgern?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["Art. 94 CRD", "§ 25a KWG"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-regime CRD/KWG; the InstitutsVergV is not in the Corpus."
    answer_key: >-
      Die variable Vergütung darf 100 % der fixen Vergütung nicht übersteigen; die Anteilseigner können mit
      qualifizierter Mehrheit bis zu 200 % billigen (Art. 94(1)(g) CRD; § 25a Abs. 5 KWG); mindestens 50 % in
      Instrumenten (Art. 94(1)(l)); mindestens 40 %, bei besonders hohen Beträgen 60 %, über vier bis fünf Jahre
      zurückbehalten (Art. 94(1)(m)); Malus und Clawback (Art. 94(1)(n)); Ausnahmen für kleine Institute und
      geringe variable Vergütung (Art. 94(3)); Einzelheiten in der InstitutsVergV auf Basis von § 25a Abs. 6 KWG.
  - id: crd-remuneration-shareholder-vote
    question: "Welche Mehrheit brauchen wir in der Haupt- oder Gesellschafterversammlung, um die variable Vergütung auf bis zu 200 % der fixen Vergütung anzuheben?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["Art. 94 CRD", "§ 25a KWG"]
    seed: false
    status: draft
    type: threshold
    origin: EBA Q&A 2014_1260
    source_url: https://eba.europa.eu/single-rule-book-qa/qna/view/publicId/2014_1260
    notes: "The EBA Q&A was archived on 26.03.2021 because the issue is addressed in section 2.2 of EBA/GL/2015/22 (since replaced by EBA/GL/2021/04); the thresholds themselves are in the article text."
    answer_key: >-
      Eine Mehrheit von mindestens 66 % der abgegebenen Stimmen, sofern mindestens 50 % der Anteile bzw.
      Stimmrechte vertreten sind, andernfalls 75 % der vertretenen Eigentumsrechte (Art. 94(1)(g)(ii) CRD; § 25a
      Abs. 5 S. 8 KWG); der Beschluss ergeht auf detaillierte Empfehlung des Instituts mit Angabe der Gründe, der
      betroffenen Mitarbeiter und der Auswirkungen auf die Eigenmittel, die Aufsicht ist zu informieren, und
      direkt betroffene Mitarbeiter dürfen nicht mitstimmen; § 25a Abs. 5 S. 8-9 KWG setzt dies mit denselben
      Quoren um.
  - id: crd-buffers
    question: "Welche Kapitalpuffer gibt es, und wer legt den antizyklischen Kapitalpuffer fest?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["§ 10d KWG", "§ 10i KWG", "Art. 136 CRD"]
    seed: false
    status: draft
    type: cross_regime
    origin: drafted
    notes: "Art. 129-133 CRD describe the single buffers but not who sets the rate; add them if the hit rule stays 'any'."
    answer_key: >-
      Kapitalerhaltungspuffer 2,5 % in hartem Kernkapital (§ 10c KWG; Art. 129 CRD), institutsspezifischer
      antizyklischer Kapitalpuffer (§ 10d; Art. 130), Puffer für systemische Risiken (§ 10e; Art. 133), Puffer für
      global bzw. anderweitig systemrelevante Institute (§§ 10f, 10g; Art. 131); zusammen die kombinierte
      Kapitalpufferanforderung (§ 10i Abs. 1) mit Ausschüttungsbeschränkungen (§ 10i Abs. 2-3; Art. 141 CRD) und
      Kapitalerhaltungsplan binnen fünf Arbeitstagen (§ 10i Abs. 6; Art. 142 CRD). Die inländische Quote des
      antizyklischen Puffers legt die BaFin als benannte Behörde quartalsweise zwischen 0 % und 2,5 % in Schritten
      von 0,25 Prozentpunkten fest; Erhöhungen gelten spätestens zwölf Monate nach Veröffentlichung (§ 10d Abs.
      3-4 KWG; Art. 136 CRD).
  - id: crd-icaap
    question: "What does the ICAAP require, and where is it specified for German institutions?"
    language: en
    regime: banking
    cross_lingual: true
    expected: ["Art. 73 CRD", "§ 25a KWG", "AT 4.1 MaRisk"]
    seed: false
    status: draft
    type: cross_regime
    origin: drafted
    notes: "BaFin's ICAAP/RTF-Leitfaden is not in the Corpus."
    answer_key: >-
      Sound, effective and comprehensive strategies and processes to assess and maintain on an ongoing basis
      internal capital adequate in amount, type and distribution to the risks, explicitly covering ESG risks over
      the short, medium and long term, reviewed regularly (Art. 73 CRD); in Germany via § 25a Abs. 1 Satz 3 Nr. 2
      KWG (Verfahren zur Ermittlung und Sicherstellung der Risikotragfähigkeit) and MaRisk AT 4.1
      (Risikotragfähigkeit: economic perspective, approval by the Geschäftsleitung, validation, annual
      multi-year capital planning incl. adverse scenarios).
  - id: crd-risk-committee
    question: "Müssen wir einen Risikoausschuss des Aufsichtsrats einrichten?"
    language: de
    regime: banking
    cross_lingual: true
    expected: ["Art. 76 CRD", "§ 25d KWG"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    notes: "The KWG now uses 'bedeutende Institute im Sinne des § 1 Abs. 3c' (total assets >= EUR 15 bn on average, SSM-significant etc.)."
    answer_key: >-
      Bedeutende Institute (§ 1 Abs. 3c KWG) müssen einen Risikoausschuss aus Mitgliedern des Aufsichtsorgans
      einrichten, der zur Risikobereitschaft und -strategie berät und deren Umsetzung überwacht, sowie Prüfungs-,
      Nominierungs- und Vergütungskontrollausschuss (§ 25d Abs. 7; Aufgaben des Risikoausschusses Abs. 8);
      andere Institute dürfen Risiko- und Prüfungsausschuss zusammenlegen und teilen dies der BaFin mit (§ 25d
      Abs. 10); Art. 76(3) CRD verlangt den Risikoausschuss aus nicht geschäftsführenden Mitgliedern bei
      Instituten von erheblicher Bedeutung und erlaubt die Kombination für andere.
  - id: crd-esg-risks
    question: "What does CRD VI require regarding the management of ESG risks?"
    language: en
    regime: banking
    cross_lingual: false
    expected: ["Art. 87a CRD", "Art. 76 CRD", "Art. 74 CRD"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "Transposed in §§ 25a, 26c and 26d KWG (new Abschnitt 5e)."
    answer_key: >-
      Robust strategies, policies, processes and systems to identify, measure, manage and monitor ESG risks over
      the short, medium and long term, proportionate to the risks and with a long-term horizon of at least ten
      years (Art. 87a(1)-(2)); testing of resilience to long-term adverse ESG scenarios starting with climate
      factors (87a(3)); specific plans with quantifiable targets and processes to address the risks from the
      transition to a sustainable economy, overseen by the management body (Art. 76(2)); governance and risk
      processes must cover ESG risks (Art. 74(1)); supervisors assess this in the SREP (87a(4)).
  - id: kwg-licence
    question: "Für welche Geschäfte brauchen wir eine Erlaubnis nach dem KWG?"
    language: de
    regime: banking
    cross_lingual: false
    expected: ["§ 32 KWG", "§ 1 KWG"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Wer im Inland gewerbsmäßig oder in einem Umfang, der einen in kaufmännischer Weise eingerichteten
      Geschäftsbetrieb erfordert, Bankgeschäfte betreiben oder Finanzdienstleistungen erbringen will, bedarf der
      schriftlichen oder elektronischen Erlaubnis der Aufsichtsbehörde (§ 32 Abs. 1 S. 1); Bankgeschäfte sind in §
      1 Abs. 1 S. 2 Nr. 1-12 (Einlagen-, Pfandbrief-, Kredit-, Diskont-, Finanzkommissions-, Depot-, Garantie-,
      Emissionsgeschäft u. a.), Finanzdienstleistungen in § 1 Abs. 1a S. 2 aufgezählt; die dem Antrag
      beizufügenden Angaben stehen in § 32 Abs. 1 S. 5; wer daneben Eigengeschäft betreiben will, braucht auch
      hierfür eine Erlaubnis (§ 32 Abs. 1a); Versagungsgründe in § 33.
  - id: kwg-significant-institution
    question: "Ab wann gilt unser Haus nach dem KWG als bedeutendes Institut, und welche zusätzlichen Governance-Pflichten folgen daraus?"
    language: de
