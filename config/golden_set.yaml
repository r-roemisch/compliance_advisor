      Emittenten, der gegen Zahlung eines Geldbetrags ausgestellt wird, um Zahlungsvorgänge durchzuführen, und
      der auch von anderen Personen als dem Emittenten angenommen wird (§ 1 Abs. 2 S. 3); kein E-Geld sind
