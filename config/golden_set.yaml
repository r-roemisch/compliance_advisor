      Informationsaustausch und Vorkehrungen zum Schutz personenbezogener Daten sowie Sicherstellung der Umsetzung
      in den beherrschten Unternehmen (§ 9 Abs. 1); Gruppenunternehmen in anderen EU-Staaten wenden das dortige
