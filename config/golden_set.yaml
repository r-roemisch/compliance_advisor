      benennen (MaGo 13.5), deren Bestellung nach § 47 Nr. 1 anzuzeigen ist; die Funktion selbst muss weiterhin
      vorhanden sein (§ 30 VAG).
  - id: sii-scr-breach
    question: "Was müssen wir tun, wenn die Solvenzkapitalanforderung nicht mehr bedeckt ist?"
    language: de
