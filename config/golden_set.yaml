    origin: drafted
    notes: "The MaGo has no fit & proper section (it refers to Rundschreiben 09/10/11/2023 (VA), which are not in the Corpus)."
    answer_key: >-
      Personen, die das Unternehmen tatsächlich leiten oder Schlüsselaufgaben wahrnehmen, müssen zuverlässig und
      fachlich geeignet sein; fachliche Eignung bedeutet angemessene theoretische und praktische Kenntnisse in
      Versicherungsgeschäften und bei Geschäftsleitern ausreichende Leitungserfahrung (§ 24 Abs. 1 VAG); Art. 42
      SII verlangt Qualifikation, Kenntnisse und Erfahrung sowie guten Leumund und Integrität jederzeit und die
      Anzeige von Wechseln (Art. 42(2)-(3); § 47 Nr. 1-2 VAG); Art. 273 DR verlangt dokumentierte Leitlinien und
      Verfahren (Abs. 1); die Eignungsprüfung berücksichtigt - soweit relevant - Versicherungs-, Finanz-,
      Rechnungslegungs-, versicherungsmathematische und Managementkenntnisse der jeweiligen Person (Abs. 2) und im
      Leitungsorgan insgesamt eine angemessene Vielfalt von Qualifikationen, Kenntnissen und Erfahrungen (Abs. 3);
      Zuverlässigkeit umfasst Redlichkeit und finanzielle Solidität (Abs. 4).
  - id: sii-key-functions
    question: "Which key functions must an insurance undertaking have, and may they be combined?"
    language: en
    regime: insurance
    cross_lingual: true
    expected: ["Art. 13 Solvency II", "Art. 271 Delegated Regulation (EU) 2015/35", "10.1 MaGo"]
    seed: false
