      drei Monate (Art. 138(1); § 134 Abs. 1); innerhalb von zwei Monaten Vorlage eines realistischen
      Sanierungsplans zur Genehmigung (Art. 138(2); § 134 Abs. 2); Wiederherstellung der Bedeckung innerhalb von
      sechs Monaten, verlängerbar um drei Monate (Art. 138(3); § 134 Abs. 3); bei von EIOPA festgestellten
      außergewöhnlich widrigen Umständen Verlängerung um bis zu sieben Jahre mit Fortschrittsbericht alle drei
      Monate (Art. 138(4); § 134 Abs. 4-6); mögliche Beschränkung der freien Verfügung über Vermögenswerte (Art.
      138(5); § 134 Abs. 7).
