      The overall solvency needs given the specific risk profile, approved risk tolerance limits and business
      strategy; continuous compliance with the SCR/MCR and technical-provision requirements; the significance
      of any deviation of the risk profile from the standard-formula assumptions (Art. 45(1)); integral part of
      the business strategy (45(4)); performed regularly and without delay after any significant change in the
