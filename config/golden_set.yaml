    answer_key: >-
      Das Unternehmen bleibt für die Einhaltung aller aufsichtsrechtlichen Vorschriften verantwortlich (§ 32
      Abs. 1 VAG; Art. 49(1) SII); die Ausgliederung darf ordnungsgemäße Ausführung, Steuerungs- und
      Kontrollmöglichkeiten des Vorstands und Prüfungsrechte der BaFin nicht beeinträchtigen (§ 32 Abs. 2); bei
      wichtigen Funktionen keine wesentliche Beeinträchtigung der Geschäftsorganisation, keine übermäßige
      Erhöhung des operationellen Risikos, keine Gefährdung der kontinuierlichen Dienstleistung (§ 32 Abs. 3;
      Art. 49(2)); Auskunfts- und Weisungsrechte vertraglich sichern (§ 32 Abs. 4; Art. 274 DR); die Absicht ist
      der BaFin unverzüglich mit Vertragsentwurf anzuzeigen (§ 47 Nr. 8 VAG); MaGo 13.4: Beschluss der
      Gesamtgeschäftsleitung, Anzeige, Ausgliederungsbeauftragte(r) nach 13.5.
  - id: idd-pog
    question: "Which product oversight and governance requirements apply to insurance products?"
    language: en
    regime: insurance
