      informiert werden (§ 47 Abs. 1 Nr. 1-3); Ausnahmen gelten u. a. für staatliche Stellen, die Weitergabe
      innerhalb der Gruppe zwischen Verpflichteten nach § 2 Abs. 1 Nr. 1-3 und 6-8 sowie zwischen
      Berufsgeheimnisträgern derselben Struktur (§ 47 Abs. 2 Nr. 1-5). AuA Kapitel 12 erläutert die
      Informationsweitergabe.
  - id: gwg-record-retention
    question: "Wie lange müssen wir die Unterlagen zur Identifizierung aufbewahren?"
