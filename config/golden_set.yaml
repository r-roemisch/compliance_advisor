    origin: drafted
    answer_key: >-
      Als Teil des internen Kontrollsystems (§ 29 Abs. 1 S. 2 VAG) berät sie den Vorstand zur Einhaltung der für
      das Versicherungsgeschäft geltenden Gesetze und Verwaltungsvorschriften, beurteilt die möglichen
      Auswirkungen von Änderungen des Rechtsumfelds und identifiziert und beurteilt das Compliance-Risiko (§ 29
      Abs. 2 VAG; Art. 46(2) SII); Art. 270 DR verlangt eine Compliance-Leitlinie und einen Compliance-Plan;
      MaGo 10.2 (Rn. 94-105): Überwachung auch externer Standards, Wirksamkeitsprüfung interner Verfahren,
      Ad-hoc-Bericht bei schwerwiegenden Verstößen, risikoorientierter Compliance-Plan, mindestens jährlicher
      Bericht.
  - id: vag-outsourcing
