      DSGVO: Auftragsverarbeitungsvertrag mit Gegenstand, Dauer, Art und Zweck der Verarbeitung, Datenarten und
      Betroffenenkategorien sowie den Pflichten des Auftragsverarbeiters - Verarbeitung nur auf dokumentierte
      Weisung, Vertraulichkeit, Sicherheitsmaßnahmen nach Art. 32, Bedingungen für Unterauftragsverarbeiter,
      Unterstützung bei Betroffenenrechten und Meldepflichten, Löschung oder Rückgabe, Nachweis- und Prüfrechte
      (Art. 28 Abs. 3 Buchst. a-h). DORA: Leistungsbeschreibung, Standorte, Datenschutz und Datenzugang bei
      Insolvenz oder Kündigung, Service Levels, Unterstützung bei Vorfällen, Kooperation mit Behörden,
      Kündigungsrechte (Art. 30 Abs. 2); bei kritischen oder wichtigen Funktionen zusätzlich SLAs mit
      Leistungszielen, Prüfungs- und Zugangsrechte, TLPT-Mitwirkung und Ausstiegsstrategien (Art. 30 Abs. 3).
  - id: gdpr-subprocessor
    question: "Darf unser Cloud-Anbieter als Auftragsverarbeiter Unterauftragsverarbeiter einsetzen?"
