      Grundsätzlich hat die betroffene Person das Recht, keiner ausschließlich auf automatisierter Verarbeitung -
      einschließlich Profiling - beruhenden Entscheidung mit rechtlicher oder ähnlich erheblicher Wirkung
      unterworfen zu werden (Art. 22 Abs. 1); zulässig nur, wenn die Entscheidung für Abschluss oder Erfüllung
      eines Vertrags erforderlich ist, aufgrund von Rechtsvorschriften mit angemessenen Schutzmaßnahmen zulässig
      ist oder auf ausdrücklicher Einwilligung beruht (Abs. 2); dann mindestens Recht auf menschliches
      Eingreifen, Darlegung des eigenen Standpunkts und Anfechtung (Abs. 3); besondere Datenkategorien nur
      eingeschränkt (Abs. 4).
  - id: ai-fria-bank
    question: "Müssen wir als Bank eine Grundrechte-Folgenabschätzung durchführen, wenn wir KI für die Kreditwürdigkeitsprüfung einsetzen?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 27 AI Act"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    notes: "Cross-lingual. v3: 'Annex III AI Act' removed - Annex III 5(b) says nothing about a FRIA, and Art. 27(1) itself names points 5(b) and (c). Art. 27(4)-(5) were replaced by Regulation (EU) 2026/1744 (DPIA cross-referencing, AI Office questionnaire)."
    answer_key: >-
      Ja. Art. 27 Abs. 1 verpflichtet neben öffentlichen Stellen ausdrücklich Betreiber von Hochrisiko-KI-Systemen
      nach Anhang III Nr. 5 Buchst. b (Kreditwürdigkeit/Bonitätsbewertung natürlicher Personen) und c
      (Risikobewertung und Preisbildung in der Lebens- und Krankenversicherung), vor der ersten Verwendung eine
      Grundrechte-Folgenabschätzung durchzuführen (Prozesse, Dauer und Häufigkeit, betroffene Personengruppen,
      spezifische Risiken, menschliche Aufsicht, Maßnahmen bei Risikoeintritt - Abs. 1 Buchst. a-f); das Ergebnis
      ist der Marktüberwachungsbehörde zu melden (Abs. 3); soweit Pflichten des Art. 27 bereits durch eine DSFA
      nach Art. 35 DSGVO erfüllt sind, kann in der Grundrechte-Folgenabschätzung auf die einschlägigen Abschnitte
      der DSFA verwiesen werden (Abs. 4 i. d. F. der VO (EU) 2026/1744); die Pflicht gilt für Anhang-III-Systeme
      ab dem 2. Dezember 2027 (Art. 113).
  - id: ai-insurance-pricing
    question: "Is AI used for risk assessment and pricing in life and health insurance a high-risk AI system?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Annex III AI Act", "Art. 6 AI Act"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    answer_key: >-
      Yes. Annex III point 5(c) covers AI systems intended to be used for risk assessment and pricing in
      relation to natural persons in the case of life and health insurance; other insurance lines are not listed;
      Art. 6(2) makes Annex III systems high-risk, subject to the Art. 6(3) derogation, which is not available
      where the system performs profiling of natural persons.
  - id: ai-fraud-detection
    question: "Does the high-risk classification also cover AI systems we use to detect payment fraud?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Annex III AI Act"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    answer_key: >-
      No. Annex III point 5(b) expressly excepts AI systems used for the purpose of detecting financial fraud
      from the creditworthiness and credit-scoring category; a fraud-detection system can only be high-risk if
      it falls under another Annex III area (e.g. biometrics) or under Art. 6(1) and Annex I.
  - id: ai-annex-iii-area-vs-usecase
    question: "Is every AI system used in one of the Annex III areas, such as access to essential financial services, automatically high-risk?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Annex III AI Act", "Art. 6 AI Act"]
    seed: false
    status: draft
    type: definition
    origin: AI Act Service Desk
    source_url: https://ai-act-service-desk.ec.europa.eu/en/faq
    notes: "FAQ entry 'What does the risk-based approach mean?' (page position changes); answer verified against Annex III and Art. 6."
    answer_key: >-
      No. Annex III names eight areas, each with specific use cases; a system is high-risk under Art. 6(2) only
      if it falls within an area and one of the use cases listed under it (e.g. in point 5: creditworthiness
      assessment of natural persons, life and health insurance pricing), not merely because it is used in that
      area; even then the Art. 6(3) derogation may apply where the system poses no significant risk and does not
      profile natural persons.
  - id: ai-financial-institutions-carve-in
    question: "Which AI Act obligations are deemed fulfilled for banks and insurers through existing financial-services governance rules?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 17 AI Act", "Art. 26 AI Act"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    notes: "v2: list trimmed to the two articles with a 'deemed fulfilled' rule (17(4), 26(5)); Art. 9(10) is not finance-specific; Art. 18(3), 19(2), 26(6) and 72(4) are integration rules, not deemed-fulfilled rules."
    answer_key: >-
      Two: for providers that are financial institutions subject to internal governance requirements under Union
      financial services law, the quality management system obligation is deemed fulfilled by complying with
      those rules, except the risk management system, post-market monitoring and serious-incident procedures
      (Art. 17(4)); for deployers that are such financial institutions, the monitoring obligation is deemed
      fulfilled by complying with the internal governance rules (Art. 26(5)). Related integration rules:
      technical documentation and logs are kept as part of the financial-services documentation (Art. 18(3),
      19(2), 26(6)) and post-market monitoring may be integrated into existing systems (Art. 72(4)).
  - id: ai-market-surveillance-bafin
    question: "Welche Behörde ist für die Marktüberwachung des AI Act bei Banken und Versicherern zuständig?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 74 AI Act"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    notes: "Cross-lingual. The conclusion 'BaFin' rests on national designation outside the Corpus - a good answer says so."
    answer_key: >-
      Für Hochrisiko-KI-Systeme, die von Finanzinstituten in Verkehr gebracht, in Betrieb genommen oder
      verwendet werden, die unter Unions-Finanzdienstleistungsrecht fallen, ist die für die Finanzaufsicht
      zuständige nationale Behörde Marktüberwachungsbehörde, soweit die Verwendung in direktem Zusammenhang mit
      den Finanzdienstleistungen steht (Art. 74 Abs. 6) - in Deutschland also die BaFin; abweichend kann ein
      Mitgliedstaat bei gesicherter Koordinierung eine andere Behörde benennen (Abs. 7); die deutsche
      Durchführungsgesetzgebung ist nicht im Korpus.
  - id: ai-literacy
    question: "Welche Pflichten zur KI-Kompetenz unserer Mitarbeiter gelten, und seit wann?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 4 AI Act", "Art. 113 AI Act"]
    seed: false
    status: draft
    type: temporal
    origin: AI Act Service Desk
    source_url: https://ai-act-service-desk.ec.europa.eu/en/faq?page=2
    notes: "Cross-lingual. Trap: Art. 4 was replaced by Regulation (EU) 2026/1744 - the 2024 wording ('nach besten Kräften ... ausreichendes Maß an KI-Kompetenz') is obsolete. The Service Desk FAQ still quotes the 2024 wording; the key follows the amended article."
    answer_key: >-
      Anbieter und Betreiber müssen Maßnahmen ergreifen, um die Entwicklung von KI-Kompetenz ihres Personals und
      anderer Personen, die in ihrem Auftrag KI-Systeme betreiben oder nutzen, zu unterstützen - unter
      Berücksichtigung von technischen Kenntnissen, Erfahrung, Ausbildung und Schulung, des Verwendungskontexts
      und der betroffenen Personen; ein bestimmtes Kompetenzniveau einzelner Personen muss nicht garantiert
      werden (Art. 4 i. d. F. der VO (EU) 2026/1744); Art. 4 gilt als Teil von Kapitel I seit dem 2. Februar 2025
      (Art. 113 Buchst. a), die neue Fassung seit 27. Juli 2026.
  - id: ai-timeline-high-risk
    question: "From when do the obligations for high-risk AI systems apply?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 113 AI Act"]
    seed: false
    status: draft
    type: temporal
    origin: drafted
    notes: "Temporal trap: the 2024 dates (2 Aug 2026 / 2 Aug 2027) were changed by Regulation (EU) 2026/1744; the Corpus holds the amended text."
    answer_key: >-
      The AI Act applies generally from 2 August 2026, but Chapter III Sections 1-3 (classification,
      requirements and provider/deployer obligations for high-risk systems, Arts. 6-27 except Art. 6(5)) apply
      from 2 December 2027 for systems that are high-risk under Art. 6(2)/Annex III and from 2 August 2028 for
      systems that are high-risk under Art. 6(1)/Annex I (Art. 113(c), as amended by Regulation (EU) 2026/1744);
      Chapters I-II apply since 2 February 2025 and the GPAI, governance and penalty chapters since 2 August 2025
      (Art. 113(a)-(b)); systems already on the market are covered only if significantly changed in design
      (Art. 111(2)).
  - id: ai-deployer-becomes-provider
    question: "If we substantially modify a vendor's high-risk AI system, do we become its provider?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 25 AI Act"]
    seed: false
    status: draft
    type: scenario
    origin: drafted
    answer_key: >-
      Yes. A deployer, distributor, importer or other third party is considered the provider and takes on the
      Art. 16 obligations if it puts its name or trademark on a high-risk system, makes a substantial
      modification to it while it remains high-risk, or modifies the intended purpose of a non-high-risk system
      so that it becomes high-risk (Art. 25(1)); the initial provider must then cooperate and hand over the
      technical documentation, information on known limitations and failure modes and targeted technical
      access, unless it clearly excluded a change into a high-risk system (Art. 25(2), as amended 2026).
  - id: ai-emotion-recognition
    question: "Dürfen wir KI zur Emotionserkennung bei Mitarbeitern im Callcenter einsetzen?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 5 AI Act"]
    seed: false
    status: draft
    type: scenario
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Nein. Das Inverkehrbringen, die Inbetriebnahme für diesen Zweck und die Verwendung von KI-Systemen zur
      Ableitung von Emotionen natürlicher Personen am Arbeitsplatz und in Bildungseinrichtungen ist verboten,
      außer das System ist aus medizinischen oder Sicherheitsgründen vorgesehen (Art. 5 Abs. 1 Buchst. f); das
      Verbot gilt seit dem 2. Februar 2025 (Art. 113 Buchst. a); Verstöße können mit bis zu 35 Mio. EUR oder 7 %
      des Jahresumsatzes geahndet werden (Art. 99 Abs. 3).
  - id: ai-biometric-bank-security
    question: "Are biometric AI systems, such as facial recognition for access to our branches or face login in our banking app, permitted under the AI Act?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 5 AI Act", "Annex III AI Act"]
    seed: false
    status: draft
    type: scenario
    origin: AI Act Service Desk
    source_url: https://ai-act-service-desk.ec.europa.eu/en/biometrics
    notes: "Verified against Annex III point 1(a), Art. 5(1)(f)-(h) and the Service Desk guidance page on biometrics (face login and premises access systems are outside 'remote biometric identification')."
    answer_key: >-
      It depends on the function: biometric verification whose sole purpose is to confirm that a person is who
      they claim to be (e.g. face login) is excluded from the Annex III point 1(a) 'remote biometric
      identification' category and is not prohibited; remote biometric identification systems are high-risk
      (Annex III point 1(a)), and real-time remote biometric identification in publicly accessible spaces is
      prohibited only for law enforcement purposes (Art. 5(1)(h)); biometric categorisation inferring sensitive
      attributes and emotion recognition at the workplace are prohibited (Art. 5(1)(g), (f)).
  - id: ai-chatbot-transparency
    question: "Müssen wir Kunden darauf hinweisen, dass sie mit einem KI-Chatbot interagieren?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 50 AI Act"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "Cross-lingual. Art. 50(1) addresses the provider; a bank deploying a vendor chatbot relies on the vendor's design but is itself provider if it develops the bot."
    answer_key: >-
      Ja. Anbieter müssen KI-Systeme, die für die direkte Interaktion mit natürlichen Personen bestimmt sind, so
      konzipieren, dass die Personen informiert werden, dass sie mit einem KI-System interagieren, sofern dies
      aus den Umständen nicht offensichtlich ist (Art. 50 Abs. 1), klar und spätestens bei der ersten Interaktion
      (Abs. 5); weitere Pflichten: maschinenlesbare Kennzeichnung synthetischer Inhalte (Abs. 2), Information bei
      Emotionserkennung (Abs. 3), Offenlegung von Deepfakes (Abs. 4); Art. 50 gilt ab dem 2. August 2026, für die
      Kennzeichnung nach Abs. 2 bei Altsystemen mit Frist bis 2. Dezember 2026 (Art. 111 Abs. 4).
  - id: ai-human-oversight
    question: "What does the human oversight requirement mean in practice for us as deployer of a high-risk AI system?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 14 AI Act", "Art. 26 AI Act"]
    seed: false
    status: draft
    type: lookup
    origin: AI Act Service Desk
    source_url: https://ai-act-service-desk.ec.europa.eu/en/faq
    notes: "FAQ entry on human oversight (page position changes); answer verified against Arts. 14 and 26."
    answer_key: >-
      The provider must design the system so that natural persons can effectively oversee it during use,
      including measures to understand its capacities and limitations, remain aware of automation bias,
      interpret output, decide not to use it or override it, and stop it (Art. 14); the deployer must implement
      the oversight measures indicated by the provider and assign human oversight to natural persons who have
      the necessary competence, training and authority and the necessary support (Art. 26(1)-(2)).
  - id: ai-serious-incident-reporting
    question: "What are the reporting deadlines for serious incidents involving a high-risk AI system?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 73 AI Act"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Hard negative for DORA (4h/24h) and GDPR (72h) deadlines."
    answer_key: >-
      Providers report serious incidents to the market surveillance authority of the Member State where the
      incident occurred immediately after establishing a causal link or reasonable likelihood and in any event no
      later than 15 days after becoming aware (Art. 73(1)-(2)); no later than 2 days for a widespread
      infringement or serious disruption of critical infrastructure (73(3)); no later than 10 days in the event
      of death (73(4)); an incomplete initial report may be followed by a complete one (73(5)); providers already
      subject to equivalent Union reporting regimes notify only incidents infringing fundamental-rights
      obligations under Art. 3(49)(c) (73(9)); deployers inform the provider immediately (Art. 26(5)).
  - id: ai-penalties
    question: "Welche Bußgelder drohen bei Verstößen gegen den AI Act?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 99 AI Act"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual."
    answer_key: >-
      Bis zu 35 Mio. EUR oder 7 % des weltweiten Jahresumsatzes des Vorjahres - je nachdem, welcher Betrag höher
      ist - für verbotene Praktiken nach Art. 5 (Art. 99 Abs. 3); bis zu 15 Mio. EUR oder 3 % für Verstöße gegen
      die Pflichten von Anbietern, Betreibern, Einführern, Händlern, notifizierten Stellen und gegen die
      Transparenzpflichten des Art. 50 (Abs. 4); bis zu 7,5 Mio. EUR oder 1 % für falsche, unvollständige oder
      irreführende Angaben gegenüber Behörden (Abs. 5); für KMU und Start-ups gilt jeweils der niedrigere
      Betrag (Abs. 6), für kleine Midcaps bei Abs. 4 und 5 ebenfalls (Abs. 6a, neu 2026).
  - id: ai-registration
    question: "Must we register a high-risk AI system we deploy in the EU database?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 49 AI Act", "Art. 71 AI Act"]
    seed: false
    status: draft
    type: applicability
    origin: drafted
    answer_key: >-
      Registration in the EU database (Art. 71) is a provider duty: before placing an Annex III high-risk system
      on the market the provider registers itself and the system (Art. 49(1)); providers that conclude under
      Art. 6(3) that their system is not high-risk register as well (49(2)); only deployers that are public
      authorities, Union bodies or persons acting on their behalf must register their use (49(3)); private
      deployers such as banks have no registration duty of their own.
  - id: ai-bias-special-categories
    question: "Dürfen wir besondere Kategorien personenbezogener Daten verarbeiten, um Verzerrungen (Bias) in unserem KI-Kreditscoring zu erkennen und zu korrigieren?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 4a AI Act"]
    seed: false
    status: draft
    type: scenario
    origin: drafted
    notes: "Cross-lingual. Art. 4a is NEW (inserted by Regulation (EU) 2026/1744, in force 27 July 2026); a system built on the 2024 text will miss it."
    answer_key: >-
      Ausnahmsweise ja: Anbieter von Hochrisiko-KI-Systemen dürfen besondere Datenkategorien verarbeiten, soweit
      dies für die Erkennung und Korrektur von Verzerrungen nach Art. 10 Abs. 2 Buchst. f und g unbedingt
      erforderlich ist und alle Bedingungen des Art. 4a Abs. 1 Buchst. a-f erfüllt sind (keine Erreichbarkeit mit
      synthetischen oder anonymisierten Daten, technische Wiederverwendungsgrenzen und Pseudonymisierung,
      strenge Zugangskontrollen, keine Weitergabe, Löschung nach Korrektur, Dokumentation im
      Verarbeitungsverzeichnis); Betreiber von Hochrisiko-Systemen dürfen dies unter denselben Bedingungen,
      wenn Verzerrungen Gesundheit, Sicherheit, Grundrechte oder das Diskriminierungsverbot berühren können
      (Abs. 2); eine Pflicht zur Bias-Prüfung begründet Art. 4a nicht.
  - id: ai-deployer-log-retention
    question: "As a bank deploying a high-risk AI system, how long must we keep the logs it generates?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 26 AI Act"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    answer_key: >-
      Deployers keep the automatically generated logs, to the extent under their control, for a period
      appropriate to the intended purpose and of at least six months, unless Union or national law - in
      particular data protection law - provides otherwise; deployers that are financial institutions subject to
      Union financial-services governance rules keep the logs as part of the documentation required under that
      law (Art. 26(6)).
  - id: gdpr-breach-72h
    question: "Innerhalb welcher Frist müssen wir eine Datenschutzverletzung der Aufsichtsbehörde melden?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 33 GDPR"]
    seed: false
    status: draft
    type: threshold
    origin: drafted
    notes: "Cross-lingual. Hard negative for the DORA incident deadlines (4h/24h/72h/1 month)."
    answer_key: >-
      Unverzüglich und möglichst binnen 72 Stunden, nachdem die Verletzung bekannt wurde, es sei denn, sie führt
      voraussichtlich nicht zu einem Risiko für die Rechte und Freiheiten natürlicher Personen; bei
      Überschreitung der 72 Stunden ist die Verzögerung zu begründen (Art. 33 Abs. 1); Auftragsverarbeiter
      melden dem Verantwortlichen unverzüglich (Abs. 2); Mindestinhalt in Abs. 3, schrittweise Nachlieferung
      möglich (Abs. 4), Dokumentationspflicht (Abs. 5); bei voraussichtlich hohem Risiko zusätzlich
      Benachrichtigung der Betroffenen (Art. 34).
  - id: gdpr-breach-data-subjects
    question: "Wann müssen wir die betroffenen Kunden selbst über eine Datenschutzverletzung informieren?"
    language: de
    regime: digital
    cross_lingual: true
    expected: ["Art. 34 GDPR"]
    seed: false
    status: draft
    type: threshold
    origin: EDPB SME guide
    source_url: https://edpb.europa.eu/sme-data-protection-guide/data-breaches_de
    notes: "Cross-lingual."
    answer_key: >-
      Wenn die Verletzung voraussichtlich ein hohes Risiko für die persönlichen Rechte und Freiheiten natürlicher
      Personen zur Folge hat, unverzüglich (Art. 34 Abs. 1); die Mitteilung beschreibt in klarer Sprache die Art
      der Verletzung und enthält mindestens die Angaben nach Art. 33 Abs. 3 Buchst. b-d (Abs. 2); entbehrlich,
      wenn die Daten wirksam verschlüsselt waren, nachträgliche Maßnahmen das hohe Risiko beseitigt haben oder
      der Aufwand unverhältnismäßig wäre - dann öffentliche Bekanntmachung (Abs. 3).
  - id: gdpr-dpia
    question: "When is a data protection impact assessment mandatory?"
    language: en
    regime: digital
    cross_lingual: false
    expected: ["Art. 35 GDPR"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    answer_key: >-
      Where a type of processing, in particular using new technologies, is likely to result in a high risk to
      the rights and freedoms of natural persons (Art. 35(1)); in particular for systematic and extensive
      evaluation of personal aspects based on automated processing including profiling with legal or similarly
      significant effects, large-scale processing of special categories or criminal data, and systematic
      large-scale monitoring of publicly accessible areas (35(3)); supervisory authorities publish lists
      (35(4)); minimum content in 35(7); prior consultation where residual risk stays high (Art. 36).
  - id: gdpr-cloud-contract-dora
    question: "Wir schließen einen Vertrag mit einem Cloud-Dienstleister - was muss nach DSGVO und DORA im Vertrag stehen?"
    language: de
