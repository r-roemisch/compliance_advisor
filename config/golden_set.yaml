    answer_key: >-
      Frühestens, wenn die FIU oder die Staatsanwaltschaft zugestimmt hat (§ 46 Abs. 1 Nr. 1) oder der dritte
      Werktag nach dem Abgangstag der Meldung verstrichen ist, ohne dass die Durchführung untersagt wurde
      (Nr. 2; der Samstag gilt nicht als Werktag); ist ein Aufschub nicht möglich oder könnte er die Verfolgung
      behindern, darf die Transaktion durchgeführt werden und die Meldung ist unverzüglich nachzuholen (§ 46
      Abs. 2); AuA 10.8.1 (Stillhaltepflicht).
  - id: gwg-tipping-off
    question: "Dürfen wir den Kunden darüber informieren, dass wir eine Verdachtsmeldung abgegeben haben?"
