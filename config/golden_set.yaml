    answer_key: >-
      Risk management, compliance, internal audit and actuarial function: Art. 13(29) Solvency II defines the
      system of governance as including these four functions (detailed in Arts. 44, 46, 47, 48 SII and Arts.
      269-272 DR); MaGo Rn. 82 names them and allows further 'Schlüsselaufgaben'. Each function must be free from
      influences compromising objective, fair and independent performance and reports to the AMSB (Art. 268 DR).
      Persons carrying out internal audit may not assume responsibility for any other function unless the
      cumulative conditions of Art. 271(2) DR are met (proportionate to nature, scale and complexity, no conflict
      of interest, separate solution disproportionately costly); other functions may share a responsible person
      only within the proportionality principle (MaGo 10.1.1, Rn. 88-90).
  - id: vag-internal-audit-outsourcing
