    answer_key: >-
      PEP ist, wer ein wichtiges öffentliches Amt ausübt oder ausgeübt hat (§ 1 Abs. 12), einschließlich
      Familienmitgliedern (Abs. 13) und bekanntermaßen nahestehenden Personen (Abs. 14); der Status ist
      risikobasiert abzuklären (§ 10 Abs. 1 Nr. 4) und löst verstärkte Sorgfaltspflichten aus: Zustimmung eines
      Mitglieds der Führungsebene, Maßnahmen zur Bestimmung der Herkunft der Vermögenswerte und verstärkte
      kontinuierliche Überwachung (§ 15 Abs. 3 Nr. 1, Abs. 4); bei ehemaligen PEP risikoorientierte Fortführung
      für mindestens zwölf Monate; AuA 7.1.
  - id: gwg-risk-analysis
    question: "Was muss unsere Risikoanalyse nach dem GwG enthalten, und wie oft ist sie zu aktualisieren?"
