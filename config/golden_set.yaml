      Manufacturers must operate a product approval process for each new product and each significant adaptation
      before marketing: identified target market, assessment of the relevant risks for that market, a distribution
      strategy consistent with it, reasonable steps to distribute to it and regular review; distributors must have
      arrangements to obtain the manufacturer's information on the approval process and target market (Art. 25(1)
      IDD; Art. 25(2) is only the delegated-act empowerment); transposed for German insurers in § 23 Abs. 1a-1c
      VAG, which under Abs. 1d do not apply to products for large risks (§ 210 Abs. 2 VVG) or to reinsurers.
  - id: sii-orsa
    question: "What must the ORSA cover and how often must it be performed?"
