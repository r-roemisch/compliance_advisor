      Ja. Bei Begründung einer neuen Geschäftsbeziehung mit einer Vereinigung nach § 20 oder Rechtsgestaltung nach
      § 21 ist ein Registrierungsnachweis oder ein Auszug aus dem Transparenzregister einzuholen (§ 12 Abs. 3);
      die Angaben zum wirtschaftlich Berechtigten müssen aber beim Vertragspartner erhoben werden - das Register
      allein genügt nicht (§ 11 Abs. 5). Fehlende Eintragungen oder Abweichungen zwischen Registerangaben und
      eigenen Erkenntnissen sind der registerführenden Stelle unverzüglich als Unstimmigkeit zu melden (§ 23a Abs.
      1); AuA 5.2.3.2.
