      Geschäftstätigkeit anhand der Risikofaktoren der Anlagen 1 und 2 und der nationalen Risikoanalyse (§ 5 Abs.
      1); Dokumentation, regelmäßige Überprüfung und Aktualisierung bei Bedarf, Vorlage auf Verlangen (§ 5 Abs. 2)
      - ein fester Turnus steht nicht im Gesetz, die BaFin erwartet aber eine Überprüfung regelmäßig, zumindest
      einmal im Jahr, und kurzfristiger bei Veränderung risikorelevanter Faktoren (AuA 2.3); gruppenweit durch das
      Mutterunternehmen (Abs. 3); Genehmigung von Risikoanalyse und Sicherungsmaßnahmen durch das verantwortliche
      Mitglied der Leitungsebene (§ 4 Abs. 3); Fünf-Schritte-Methode in AuA 2.2, Dokumentation und Aktualisierung
