  - id: sii-governance
    question: "What must an insurer's system of governance include under Solvency II?"
    language: en
    regime: insurance
    cross_lingual: true
    expected: ["Art. 41 Solvency II", "Art. 258 Delegated Regulation (EU) 2015/35", "§ 23 VAG"]
    seed: false
    status: draft
    type: lookup
    origin: drafted
    notes: "v2: '§ 23 VAG' added (German transposition answers the question for a German insurer)."
    answer_key: >-
      An effective system providing for sound and prudent management: a transparent organisational structure
      with clear allocation and segregation of responsibilities and effective information transmission, subject
      to regular internal review and proportionality (Art. 41(1)-(2)); written policies on risk management,
      internal control, internal audit and outsourcing, approved by the AMSB and reviewed at least annually
      (Art. 41(3)); contingency plans and DORA-compliant network and information systems (Art. 41(4)).
      Art. 258 DR details reporting lines, decision-making, information systems, record-keeping, the
      'at least two persons' rule and conflict-of-interest processes; § 23 VAG transposes.
  - id: vag-compliance-function
    question: "Welche Aufgaben hat die Compliance-Funktion eines Versicherungsunternehmens?"
    language: de
    regime: insurance
    cross_lingual: true
    expected: ["§ 29 VAG", "10.2 MaGo", "Art. 270 Delegated Regulation (EU) 2015/35", "Art. 46 Solvency II"]
    seed: false
