      Vermögensgegenstände aus strafbaren Handlungen, Terrorismusfinanzierung oder die Verweigerung der
      Offenlegung des wirtschaftlich Berechtigten hindeuten); Strafanzeigen sind bei Polizei oder
      Staatsanwaltschaft zu erstatten. Liegen zugleich Tatsachen im Sinne von § 43 vor, ist zusätzlich eine
      Verdachtsmeldung abzugeben, in der die erstattete Strafanzeige anzugeben ist (§ 43 Abs. 1 Satz 2; AuA
      10.8.3).

