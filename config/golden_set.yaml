  - id: zag-payment-vs-initiation
    question: "Betreibt ein Anbieter, der nur Überweisungsdaten in die Online-Banking-Sitzung des Kunden übergibt, ohne die Überweisung selbst auszuführen, ein Zahlungsgeschäft nach dem ZAG?"
