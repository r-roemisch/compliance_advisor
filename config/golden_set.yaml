      Risikoanalyse und die internen Grundsätze kennen, einschließlich der Verarbeitung personenbezogener Daten
      (Art. 12(1)); dazu gehören spezifische, fortlaufende und auf Funktion und Risiko zugeschnittene
      Schulungsprogramme, die ordnungsgemäß zu dokumentieren sind (Art. 12(2)).
  - id: gwg-suspicious-report-when
    question: "Wann müssen wir eine Verdachtsmeldung an die FIU abgeben - braucht es einen konkreten Verdacht?"
    language: de
    regime: aml
    cross_lingual: false
    expected: ["§ 43 GwG", "10.3 BaFin AuA GwG"]
    seed: true
    status: draft
    type: threshold
    origin: drafted
    notes: "AuA 10.3 'Voraussetzungen der Meldepflicht' heading verified; body text not read."
    answer_key: >-
      Nein, ein strafprozessualer Anfangsverdacht ist nicht erforderlich. Zu melden ist unverzüglich und
      unabhängig vom Wert, wenn Tatsachen darauf hindeuten, dass ein Vermögensgegenstand aus einer strafbaren
      Handlung stammt, die eine Vortat der Geldwäsche sein könnte, dass ein Bezug zur Terrorismusfinanzierung
      besteht oder dass der Vertragspartner seine Offenlegungspflicht zum wirtschaftlich Berechtigten verletzt hat
      (§ 43 Abs. 1 Nr. 1-3); die Meldung erfolgt elektronisch an die FIU, bei der sich Verpflichtete unabhängig
      von einer Meldung registrieren müssen (§ 45 Abs. 1); die Voraussetzungen der Meldepflicht erläutert AuA
      10.3.
  - id: gwg-transaction-after-report
    question: "Dürfen wir eine Transaktion ausführen, nachdem wir eine Verdachtsmeldung abgegeben haben?"
    language: de
    regime: aml
