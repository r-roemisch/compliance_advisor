      Sicherheitsniveau aufweist (§ 13 Abs. 1 Nr. 2); zulässige Dokumente und Mittel für natürliche Personen
      stehen in § 12 Abs. 1 (amtlicher Lichtbildausweis, eID, qualifizierte elektronische Signatur, notifiziertes
      eID-System); die konkreten Anforderungen an die Videoidentifizierung regelt das BaFin-Rundschreiben 3/2017
      (GW), das nicht im Korpus ist; die AuA behandeln die Überprüfung der erhobenen Angaben in 5.1.3.2.
  - id: gwg-pep
    question: "Wer gilt als politisch exponierte Person, und welche Pflichten löst das aus?"
    language: de
