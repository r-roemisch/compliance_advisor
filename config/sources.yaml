# Source Registry: every Source the Compliance Advisor should hold, and where it comes from.
# Terms (Source, Regime, Regulatory Layer) are defined in CONTEXT.md.
#
# Not legal advice. The Compliance Advisor gives general regulatory information only.
#
# Fields
#   id            kebab-case, prefixed eu- or de-
#   title         full official title
#   short_title   the name used in citations, e.g. DORA, GwG
#   regime        dora | aml | payments | insurance | banking | digital
#   layer         eu_level_1 | eu_level_2 | eu_level_3 | national_law | supervisory_practice
#   issuer        who issued it; shown next to a citation
#   language      en | de                                      (official language, ADR 0002)
#   format        html | gii_xml | pdf | web_html               (chooses the loader; web_html = BaFin web page)
#   url           where compliance-advisor-fetch downloads the file
#   display_url   the page a person opens to read the Source (optional; defaults to url).
#                 Provision links build on it: EU acts append "#art_17", German acts replace the
#                 index page by "__10.html", PDFs append "#page=N" to `url`.
#   legal_status  in_force | applies_later | pending_proposal   (CONTEXT.md: Legal Status)
#   version       which text this is, e.g. "OJ L 333, 27.12.2022" or "last amended 29.6.2026"
#   milestones    dated events, checked against the official text: [{date: 2025-01-17, what: "..."}]
#   notes         anything worth knowing
#
# EU acts are downloaded from the EU Publications Office (publications.europa.eu), which serves
# the same official text as EUR-Lex. EUR-Lex itself answers scripts with an empty challenge page.
# Addresses checked 2026-10-21. Dates and versions checked against the downloaded texts 2026-10-22.

