# Compliance Advisor: general regulatory information, not legal advice.
#
#   docker compose up -d postgres     # the database only (sub-step 1a and local development)
#
# The backend and frontend containers are added in sub-step 1c; the app then runs as exactly
# three containers: postgres, backend, frontend.

name: compliance_advisor

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
      POSTGRES_DB: advisor
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d advisor"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
