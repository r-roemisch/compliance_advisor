# Compliance Advisor: general regulatory information, not legal advice.
#
#   docker compose up --build          # the whole app: http://localhost:3010
#   docker compose up -d postgres      # the database only, for local development
#   docker compose run --rm backend compliance-advisor-ingest --dry-run
#
# Exactly three containers: postgres, backend, frontend.

name: compliance_advisor

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
      POSTGRES_DB: advisor
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d advisor"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://advisor:advisor@postgres:5432/advisor
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ports: ["8010:8010"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health')"]
      interval: 10s
      retries: 6

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8010
    ports: ["3010:3010"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  postgres-data:
